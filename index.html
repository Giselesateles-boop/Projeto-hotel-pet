<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet - Login</title>

</head>

<body>

    <header>

        <h1>Hotel Pet</h1>

        <p>Hotel e cuidado para o seu melhor amigo</p>

    </header>


    <main>

        <section>

            <h2>Login</h2>

            <form action="pages/dashboard.html">

                <div>

                    <label for="email">E-mail:</label>

                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required
                    >

                </div>


                <br>


                <div>

                    <label for="senha">Senha:</label>

                    <input 
                        type="password" 
                        id="senha" 
                        name="senha" 
                        required
                    >

                </div>


                <br>


                <button type="submit">
                    Entrar
                </button>

            </form>


            <p>

                <a href="pages/dashboard.html">
                    Acessar como Gerente
                </a>

            </p>

        </section>

    </main>


    <footer>

        <p>
            &copy; 2026 Hotel Pet
        </p>

    </footer>

</body>

</html>
