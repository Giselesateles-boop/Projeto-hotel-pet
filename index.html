<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet - Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="pagina-login">

        <header class="cabecalho-login">

            <h1>Hotel Pet</h1>

            <p>
                Hotel e cuidado para o seu melhor amigo
            </p>

        </header>


        <main class="conteudo-login">

            <section class="card-login">

                <h2>Login</h2>

                <form action="pages/dashboard.html">

                    <div class="campo-formulario">

                        <label for="email">
                            E-mail *
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Digite seu e-mail"
                            required>

                    </div>


                    <div class="campo-formulario">

                        <label for="senha">
                            Senha *
                        </label>

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            required>

                    </div>


                    <button
                        type="submit"
                        class="botao botao-salvar">
                        Entrar
                    </button>

                </form>


                <p class="acesso-gerente">

                    <a href="pages/dashboard.html">
                        Acessar como Gerente
                    </a>

                </p>

            </section>

        </main>


        <footer class="rodape-login">

            <p>
                &copy; 2026 Hotel Pet
            </p>

        </footer>

    </div>

</body>

</html>
