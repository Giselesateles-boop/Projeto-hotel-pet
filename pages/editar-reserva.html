<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet - Editar Reserva</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="layout">

        <aside class="menu-lateral">

            <h1>Hotel Pet</h1>

            <nav>

                <a href="pets.html">
                    Pet
                </a>

                <a href="usuarios.html">
                    Usuário
                </a>

                <a href="configuracoes.html">
                    Configurações
                </a>

                <a href="reservas.html" class="menu-ativo">
                    Reservas
                </a>

            </nav>

        </aside>


        <div class="conteudo">

            <header class="topo">

                <div></div>

                <a href="perfil.html" class="perfil-topo">

                    <span class="icone-usuario">
                        O
                    </span>

                    <span>
                        Gisele Teles
                    </span>

                </a>

            </header>


            <main>

                <p class="breadcrumb">

                    <a href="dashboard.html">
                        Home
                    </a>

                    /

                    <a href="reservas.html">
                        Reservas
                    </a>

                    /

                    Editar Reserva

                </p>


                <section class="card">

                    <h2>
                        Editar Reserva
                    </h2>


                    <form
                        action="reservas.html"
                        method="get"
                    >

                        <section class="secao-formulario">

                            <h3>
                                Dados da Reserva
                            </h3>


                            <div class="formulario-duas-colunas">


                                <div class="campo-formulario">

                                    <label for="id">
                                        ID da reserva
                                    </label>

                                    <input
                                        type="text"
                                        id="id"
                                        name="id"
                                        value="001"
                                        readonly
                                    >

                                </div>


                                <div class="campo-formulario">

                                    <label for="status">
                                        Status *
                                    </label>

                                    <select
                                        id="status"
                                        name="status"
                                        required
                                    >

                                        <option value="agendada">
                                            Agendada
                                        </option>

                                        <option
                                            value="confirmada"
                                            selected
                                        >
                                            Confirmada
                                        </option>

                                        <option value="andamento">
                                            Em andamento
                                        </option>

                                        <option value="finalizada">
                                            Finalizada
                                        </option>

                                    </select>

                                </div>


                                <div class="campo-formulario">

                                    <label for="entrada">
                                        Data de entrada *
                                    </label>

                                    <input
                                        type="date"
                                        id="entrada"
                                        name="entrada"
                                        value="2026-08-20"
                                        required
                                    >

                                </div>


                                <div class="campo-formulario">

                                    <label for="saida">
                                        Data de saída *
                                    </label>

                                    <input
                                        type="date"
                                        id="saida"
                                        name="saida"
                                        value="2026-08-25"
                                        required
                                    >

                                </div>


                                <div class="campo-formulario">

                                    <label for="diarias">
                                        Quantidade de diárias
                                    </label>

                                    <input
                                        type="number"
                                        id="diarias"
                                        name="diarias"
                                        value="5"
                                        min="1"
                                    >

                                </div>


                                <div class="campo-formulario">

                                    <label for="valor-diaria">
                                        Valor da diária
                                    </label>

                                    <input
                                        type="text"
                                        id="valor-diaria"
                                        name="valor-diaria"
                                        value="R$ 80,00"
                                        readonly
                                    >

                                </div>


                                <div class="campo-formulario">

                                    <label for="valor-total">
                                        Valor total
                                    </label>

                                    <input
                                        type="text"
                                        id="valor-total"
                                        name="valor-total"
                                        value="R$ 400,00"
                                        readonly
                                    >

                                </div>

                            </div>

                        </section>


                        <section class="secao-formulario">

                            <h3>
                                Pet e Tutor
                            </h3>


                            <div class="formulario-duas-colunas">


                                <div class="campo-formulario">

                                    <label for="pet">
                                        Pet *
                                    </label>

                                    <select
                                        id="pet"
                                        name="pet"
                                        required
                                    >

                                        <option
                                            value="thor"
                                            selected
                                        >
                                            Thor
                                        </option>

                                        <option value="luna">
                                            Luna
                                        </option>

                                        <option value="mel">
                                            Mel
                                        </option>

                                        <option value="bob">
                                            Bob
                                        </option>

                                    </select>

                                </div>


                                <div class="campo-formulario">

                                    <label for="tutor">
                                        Tutor *
                                    </label>

                                    <select
                                        id="tutor"
                                        name="tutor"
                                        required
                                    >

                                        <option
                                            value="maria"
                                            selected
                                        >
                                            Maria Silva
                                        </option>

                                        <option value="joao">
                                            João Santos
                                        </option>

                                        <option value="ana">
                                            Ana Oliveira
                                        </option>

                                        <option value="gisele">
                                            Gisele Teles
                                        </option>

                                    </select>

                                </div>

                            </div>

                        </section>


                        <section class="secao-formulario">

                            <h3>
                                Observações
                            </h3>


                            <div class="campo-formulario">

                                <label for="observacoes">
                                    Observações
                                </label>

                                <textarea
                                    id="observacoes"
                                    name="observacoes"
                                    rows="5"
                                >Hospedagem para o período de 20/08/2026 a 25/08/2026.</textarea>

                            </div>

                        </section>


                        <div class="botoes-formulario">

                            <button
                                type="submit"
                                class="botao botao-salvar"
                            >
                                Salvar
                            </button>


                            <button
                                type="reset"
                                class="botao botao-limpar"
                            >
                                Limpar
                            </button>


                            <a
                                href="reservas.html"
                                class="botao botao-cancelar"
                            >
                                Cancelar
                            </a>

                        </div>


                    </form>

                </section>

            </main>

        </div>

    </div>

</body>

</html>
