<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet - Cadastrar Reserva</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="layout">

        <aside class="menu-lateral">

            <h1>Hotel Pet</h1>

            <nav>

                <a href="pets.html">
                    Pet
                </a>

                <a href="usuarios.html">
                    Usuário
                </a>

                <a href="configuracoes.html">
                    Configurações
                </a>

                <a href="reservas.html" class="menu-ativo">
                    Reservas
                </a>

            </nav>

        </aside>


        <div class="conteudo">

            <header class="topo">

                <div></div>

                <a href="perfil.html" class="perfil-topo">

                    <span class="icone-usuario">
                        O
                    </span>

                    <span>
                        Gisele Teles
                    </span>

                </a>

            </header>


            <main>

                <p class="breadcrumb">

                    <a href="dashboard.html">
                        Home
                    </a>

                    /

                    <a href="reservas.html">
                        Reservas
                    </a>

                    /

                    Cadastrar Reserva

                </p>


                <div class="cabecalho-pagina">

                    <h2>
                        Cadastrar Reserva
                    </h2>

                </div>


                <section class="card">

                    <form
                        action="reservas.html"
                        method="get"
                        class="formulario-duas-colunas"
                    >

                        <div class="campo-formulario">

                            <label for="pet">
                                Pet *
                            </label>

                            <select
                                id="pet"
                                name="pet"
                                required
                            >

                                <option value="">
                                    Selecione o pet
                                </option>

                                <option value="thor">
                                    Thor
                                </option>

                                <option value="luna">
                                    Luna
                                </option>

                                <option value="mel">
                                    Mel
                                </option>

                                <option value="bob">
                                    Bob
                                </option>

                            </select>

                        </div>


                        <div class="campo-formulario">

                            <label for="tutor">
                                Tutor *
                            </label>

                            <select
                                id="tutor"
                                name="tutor"
                                required
                            >

                                <option value="">
                                    Selecione o tutor
                                </option>

                                <option value="maria">
                                    Maria Silva
                                </option>

                                <option value="joao">
                                    João Santos
                                </option>

                                <option value="ana">
                                    Ana Oliveira
                                </option>

                                <option value="gisele">
                                    Gisele Teles
                                </option>

                            </select>

                        </div>


                        <div class="campo-formulario">

                            <label for="entrada">
                                Data de entrada *
                            </label>

                            <input
                                type="date"
                                id="entrada"
                                name="entrada"
                                required
                            >

                        </div>


                        <div class="campo-formulario">

                            <label for="saida">
                                Data de saída *
                            </label>

                            <input
                                type="date"
                                id="saida"
                                name="saida"
                                required
                            >

                        </div>


                        <div class="campo-formulario">

                            <label for="status">
                                Status *
                            </label>

                            <select
                                id="status"
                                name="status"
                                required
                            >

                                <option value="">
                                    Selecione o status
                                </option>

                                <option value="agendada">
                                    Agendada
                                </option>

                                <option value="confirmada">
                                    Confirmada
                                </option>

                                <option value="andamento">
                                    Em andamento
                                </option>

                            </select>

                        </div>


                        <div class="campo-formulario">

                            <label for="diarias">
                                Quantidade de diárias
                            </label>

                            <input
                                type="number"
                                id="diarias"
                                name="diarias"
                                min="1"
                                placeholder="Informe a quantidade"
                            >

                        </div>


                        <div class="campo-formulario">

                            <label for="diaria">
                                Valor da diária
                            </label>

                            <input
                                type="text"
                                id="diaria"
                                name="diaria"
                                value="R$ 80,00"
                                readonly
                            >

                        </div>


                        <div class="campo-formulario">

                            <label for="total">
                                Valor total
                            </label>

                            <input
                                type="text"
                                id="total"
                                name="total"
                                value="R$ 0,00"
                                readonly
                            >

                        </div>


                        <div class="campo-formulario campo-completo">

                            <label for="observacoes">
                                Observações
                            </label>

                            <textarea
                                id="observacoes"
                                name="observacoes"
                                rows="5"
                                placeholder="Digite alguma observação sobre a reserva..."
                            ></textarea>

                        </div>


                        <div class="campo-formulario campo-completo">

                            <label for="foto">
                                Foto do Pet
                            </label>

                            <input
                                type="file"
                                id="foto"
                                name="foto"
                                accept="image/*"
                            >

                        </div>


                        <div class="campo-formulario campo-completo">

                            <label for="comprovante">
                                Comprovante
                            </label>

                            <input
                                type="file"
                                id="comprovante"
                                name="comprovante"
                                accept=".pdf,.jpg,.jpeg,.png"
                            >

                        </div>


                        <div class="acoes-formulario campo-completo">

                            <button
                                type="submit"
                                class="botao botao-salvar"
                            >
                                Salvar
                            </button>


                            <button
                                type="reset"
                                class="botao botao-limpar"
                            >
                                Limpar
                            </button>


                            <a
                                href="reservas.html"
                                class="botao botao-cancelar"
                            >
                                Cancelar
                            </a>

                        </div>

                    </form>

                </section>

            </main>

        </div>

    </div>

</body>

</html>
