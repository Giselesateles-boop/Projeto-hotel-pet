<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet - Visualizar Reserva</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <div class="layout">

        <!-- MENU LATERAL -->
        <aside class="menu-lateral">

            <h1>
                Hotel Pet
            </h1>

            <nav>

                <a href="pets.html">
                    Pet
                </a>

                <a href="usuarios.html">
                    Usuário
                </a>

                <a href="configuracoes.html">
                    Configurações
                </a>

                <a href="reservas.html" class="menu-ativo">
                    Reservas
                </a>

            </nav>

        </aside>


        <!-- ÁREA PRINCIPAL -->
        <div class="conteudo">

            <!-- TOPO -->
            <header class="topo">

                <div></div>

                <a href="perfil.html" class="perfil-topo">

                    <span class="icone-usuario">
                        O
                    </span>

                    <span>
                        Gisele Teles
                    </span>

                </a>

            </header>


            <!-- CONTEÚDO -->
            <main>

                <!-- BREADCRUMB -->
                <p class="breadcrumb">

                    <a href="dashboard.html">
                        Home
                    </a>

                    /

                    <a href="reservas.html">
                        Reservas
                    </a>

                    /

                    Visualizar Reserva

                </p>


                <!-- CARD -->
                <section class="card">

                    <h2>
                        Visualizar Reserva
                    </h2>


                    <!-- DADOS DA RESERVA -->
                    <section class="secao-formulario">

                        <h3>
                            Dados da Reserva
                        </h3>


                        <div class="formulario-duas-colunas">

                            <div class="campo-formulario">

                                <label for="id-reserva">
                                    ID da reserva
                                </label>

                                <input
                                    type="text"
                                    id="id-reserva"
                                    value="001"
                                    readonly
                                >

                            </div>


                            <div class="campo-formulario">

                                <label for="status-reserva">
                                    Status
                                </label>

                                <input
                                    type="text"
                                    id="status-reserva"
                                    value="Confirmada"
                                    readonly
                                >

                            </div>


                            <div class="campo-formulario">

                                <label for="entrada-reserva">
                                    Data de entrada
                                </label>

                                <input
                                    type="text"
                                    id="entrada-reserva"
                                    value="20/08/2026"
                                    readonly
                                >

                            </div>


                            <div class="campo-formulario">

                                <label for="saida-reserva">
                                    Data de saída
                                </label>

                                <input
                                    type="text"
                                    id="saida-reserva"
                                    value="25/08/2026"
                                    readonly
                                >

                            </div>


                            <div class="campo-formulario">

                                <label for="diarias-reserva">
                                    Quantidade de diárias
                                </label>

                                <input
                                    type="text"
                                    id="diarias-reserva"
                                    value="5 diárias"
                                    readonly
                                >

                            </div>


                            <div class="campo-formulario">

                                <label for="valor-diaria">
                                    Valor da diária
                                </label>

                                <input
                                    type="text"
                                    id="valor-diaria"
                                    value="R$ 80,00"
                                    readonly
                                >

                            </div>


                            <div class="campo-formulario">

                                <label for="valor-total">
                                    Valor total
                                </label>

                                <input
                                    type="text"
                                    id="valor-total"
                                    value="R$ 400,00"
                                    readonly
                                >

                            </div>

                        </div>

                    </section>


                    <!-- DADOS DO PET -->
                    <section class="secao-formulario">

                        <h3>
                            Dados do Pet
                        </h3>


                        <div class="formulario-duas-colunas">

                            <div class="campo-formulario">

                                <label for="nome-pet">
                                    Nome do pet
                                </label>

                                <input
                                    type="text"
                                    id="nome-pet"
                                    value="Thor"
                                    readonly
                                >

                            </div>


                            <div class="campo-formulario">

                                <label for="tipo-pet">
                                    Tipo
                                </label>

                                <input
                                    type="text"
                                    id="tipo-pet"
                                    value="Cachorro"
                                    readonly
                                >

                            </div>


                            <div class="campo-formulario">

                                <label for="raca-pet">
                                    Raça
                                </label>

                                <input
                                    type="text"
                                    id="raca-pet"
                                    value="Golden Retriever"
                                    readonly
                                >

                            </div>


                            <div class="campo-formulario">

                                <label for="porte-pet">
                                    Porte
                                </label>

                                <input
                                    type="text"
                                    id="porte-pet"
                                    value="Grande"
                                    readonly
                                >

                            </div>

                        </div>

                    </section>


                    <!-- PROPRIETÁRIO -->
                    <section class="secao-formulario">

                        <h3>
                            Proprietário
                        </h3>


                        <div class="formulario-duas-colunas">

                            <div class="campo-formulario">

                                <label for="nome-proprietario">
                                    Nome do proprietário
                                </label>

                                <input
                                    type="text"
                                    id="nome-proprietario"
                                    value="Maria Silva"
                                    readonly
                                >

                            </div>


                            <div class="campo-formulario">

                                <label for="email-proprietario">
                                    E-mail
                                </label>

                                <input
                                    type="email"
                                    id="email-proprietario"
                                    value="maria@email.com"
                                    readonly
                                >

                            </div>


                            <div class="campo-formulario">

                                <label for="telefone-proprietario">
                                    Telefone
                                </label>

                                <input
                                    type="text"
                                    id="telefone-proprietario"
                                    value="(77) 99999-9999"
                                    readonly
                                >

                            </div>

                        </div>

                    </section>


                    <!-- OBSERVAÇÕES -->
                    <section class="secao-formulario">

                        <h3>
                            Observações
                        </h3>


                        <div class="campo-formulario campo-completo">

                            <label for="observacoes">
                                Observações da reserva
                            </label>

                            <textarea
                                id="observacoes"
                                rows="4"
                                readonly>Pet precisa receber alimentação duas vezes ao dia e realizar passeios durante a hospedagem.</textarea>

                        </div>

                    </section>


                    <!-- FOTO DO PET -->
                    <section class="secao-formulario">

                        <h3>
                            Foto do Pet
                        </h3>


                        <div class="foto-pet">

                            <img
                                src="../img/Thor.png"
                                alt="Foto de Thor"
                                style="
                                    width: 180px;
                                    height: 180px;
                                    object-fit: cover;
                                    border-radius: 12px;
                                    display: block;
                                "
                            >

                        </div>

                    </section>


                    <!-- COMPROVANTE -->
                    <section class="secao-formulario">

                        <h3>
                            Comprovante
                        </h3>


                        <div class="arquivo-comprovante">

                            <p>
                                comprovante-reserva-001.pdf
                            </p>

                            <a href="#">
                                Visualizar comprovante
                            </a>

                        </div>

                    </section>


                    <!-- BOTÕES -->
                    <div class="botoes-formulario">

                        <a
                            href="editar-reserva.html"
                            class="botao botao-salvar"
                        >
                            Editar
                        </a>


                        <a
                            href="reservas.html"
                            class="botao botao-cancelar"
                        >
                            Voltar
                        </a>

                    </div>

                </section>

            </main>

        </div>

    </div>

</body>

</html>
