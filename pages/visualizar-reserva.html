<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet - Visualizar Reserva</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="layout">

        <!-- MENU LATERAL -->
        <aside class="menu-lateral">

            <h1>Hotel Pet</h1>

            <nav>

                <a href="pets.html">
                    🐾 Pet
                </a>

                <a href="usuarios.html">
                    ♙ Usuário
                </a>

                <a href="configuracoes.html">
                    ⚙ Configurações
                </a>

                <a href="reservas.html" class="menu-ativo">
                    ▣ Reservas
                </a>

            </nav>

        </aside>


        <!-- ÁREA PRINCIPAL -->
        <div class="conteudo">

            <!-- TOPO -->
            <header class="topo">

                <div></div>

                <div class="perfil-topo">

                    <span class="icone-usuario">
                        ◯
                    </span>

                    <span>
                        João da Silva
                    </span>

                </div>

            </header>


            <!-- CONTEÚDO -->
            <main>

                <p class="breadcrumb">
                    Home / Reservas / Visualizar Reserva
                </p>


                <section class="card">

                    <h2>
                        Visualizar Reserva
                    </h2>


                    <!-- DADOS DA RESERVA -->
                    <section class="secao-formulario">

                        <h3>
                            Dados da Reserva
                        </h3>


                        <div class="formulario-duas-colunas">

                            <div class="campo-formulario">

                                <label>
                                    ID da reserva
                                </label>

                                <input
                                    type="text"
                                    value="001"
                                    readonly>

                            </div>


                            <div class="campo-formulario">

                                <label>
                                    Status
                                </label>

                                <input
                                    type="text"
                                    value="Confirmada"
                                    readonly>

                            </div>


                            <div class="campo-formulario">

                                <label>
                                    Data de entrada
                                </label>

                                <input
                                    type="text"
                                    value="20/08/2026"
                                    readonly>

                            </div>


                            <div class="campo-formulario">

                                <label>
                                    Data de saída
                                </label>

                                <input
                                    type="text"
                                    value="25/08/2026"
                                    readonly>

                            </div>


                            <div class="campo-formulario">

                                <label>
                                    Quantidade de diárias
                                </label>

                                <input
                                    type="text"
                                    value="5 diárias"
                                    readonly>

                            </div>


                            <div class="campo-formulario">

                                <label>
                                    Valor da diária
                                </label>

                                <input
                                    type="text"
                                    value="R$ 80,00"
                                    readonly>

                            </div>


                            <div class="campo-formulario">

                                <label>
                                    Valor total
                                </label>

                                <input
                                    type="text"
                                    value="R$ 400,00"
                                    readonly>

                            </div>

                        </div>

                    </section>


                    <!-- DADOS DO PET -->
                    <section class="secao-formulario">

                        <h3>
                            Dados do Pet
                        </h3>


                        <div class="formulario-duas-colunas">

                            <div class="campo-formulario">

                                <label>
                                    Nome do pet
                                </label>

                                <input
                                    type="text"
                                    value="Thor"
                                    readonly>

                            </div>


                            <div class="campo-formulario">

                                <label>
                                    Tipo
                                </label>

                                <input
                                    type="text"
                                    value="Cachorro"
                                    readonly>

                            </div>


                            <div class="campo-formulario">

                                <label>
                                    Raça
                                </label>

                                <input
                                    type="text"
                                    value="Golden Retriever"
                                    readonly>

                            </div>


                            <div class="campo-formulario">

                                <label>
                                    Porte
                                </label>

                                <input
                                    type="text"
                                    value="Grande"
                                    readonly>

                            </div>

                        </div>

                    </section>


                    <!-- PROPRIETÁRIO -->
                    <section class="secao-formulario">

                        <h3>
                            Proprietário
                        </h3>


                        <div class="formulario-duas-colunas">

                            <div class="campo-formulario">

                                <label>
                                    Nome do proprietário
                                </label>

                                <input
                                    type="text"
                                    value="Maria Silva"
                                    readonly>

                            </div>


                            <div class="campo-formulario">

                                <label>
                                    E-mail
                                </label>

                                <input
                                    type="email"
                                    value="maria@email.com"
                                    readonly>

                            </div>


                            <div class="campo-formulario">

                                <label>
                                    Telefone
                                </label>

                                <input
                                    type="text"
                                    value="(77) 99999-9999"
                                    readonly>

                            </div>

                        </div>

                    </section>


                    <!-- OBSERVAÇÕES -->
                    <section class="secao-formulario">

                        <h3>
                            Observações
                        </h3>


                        <div class="campo-formulario campo-completo">

                            <label>
                                Observações da reserva
                            </label>

                            <textarea
                                rows="4"
                                readonly>Pet precisa receber alimentação duas vezes ao dia e realizar passeios durante a hospedagem.</textarea>

                        </div>

                    </section>


                    <!-- FOTO DO PET -->
                    <section class="secao-formulario">

                        <h3>
                            Foto do Pet
                        </h3>


                        <div class="foto-pet">

                            <div class="foto-placeholder">
                                🐶
                            </div>

                        </div>

                    </section>


                    <!-- COMPROVANTE -->
                    <section class="secao-formulario">

                        <h3>
                            Comprovante
                        </h3>


                        <div class="arquivo-comprovante">

                            <p>
                                📄 comprovante-reserva-001.pdf
                            </p>

                            <a href="#">
                                Visualizar comprovante
                            </a>

                        </div>

                    </section>


                    <!-- BOTÕES -->
                    <div class="botoes-formulario">

                        <a
                            href="editar-reserva.html"
                            class="botao botao-salvar">
                            ✎ Editar
                        </a>


                        <a
                            href="reservas.html"
                            class="botao botao-cancelar">
                            ← Voltar
                        </a>

                    </div>

                </section>

            </main>

        </div>

    </div>

</body>

</html>
