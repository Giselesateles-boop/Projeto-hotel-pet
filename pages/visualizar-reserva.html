<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet - Visualizar Reserva</title>

    <link rel="stylesheet"
        href="../css/style.css">

</head>

<body>

    <div class="layout">


        <!-- MENU LATERAL -->

        <aside class="menu-lateral">

            <h1>
                Hotel Pet
            </h1>


            <nav>

                <a href="pets.html">
                    🐾 Pet
                </a>


                <a href="usuarios.html">
                    ♙ Usuário
                </a>


                <a href="configuracoes.html">
                    ⚙ Configurações
                </a>


                <a href="reservas.html"
                    class="menu-ativo">
                    ▣ Reservas
                </a>

            </nav>

        </aside>



        <!-- ÁREA PRINCIPAL -->

        <div class="conteudo">


            <!-- TOPO -->

            <header class="topo">

                <div></div>


                <a href="perfil.html"
                    class="perfil-topo">

                    <span class="icone-usuario">
                        ◯
                    </span>


                    <span>
                        Gisele Teles
                    </span>

                </a>

            </header>



            <!-- CONTEÚDO -->

            <main>


                <!-- BREADCRUMB -->

                <p class="breadcrumb">

                    <a href="dashboard.html">
                        Home
                    </a>

                    /

                    <a href="reservas.html">
                        Reservas
                    </a>

                    /

                    Visualizar Reserva

                </p>



                <section class="card">


                    <h2>
                        Visualizar Reserva
                    </h2>



                    <!-- DADOS DA RESERVA -->

                    <section class="secao-formulario">

                        <h3>
                            Dados da Reserva
                        </h3>


                        <div class="formulario-duas-colunas">


                            <div class="campo-formulario">

                                <label>
                                    ID da reserva
                                </label>

                                <input
                                    type="text"
                                    id="id-reserva"
                                    readonly>

                            </div>



                            <div class="campo-formulario">

                                <label>
                                    Status
                                </label>

                                <input
                                    type="text"
                                    id="status-reserva"
                                    readonly>

                            </div>



                            <div class="campo-formulario">

                                <label>
                                    Data de entrada
                                </label>

                                <input
                                    type="text"
                                    id="entrada-reserva"
                                    readonly>

                            </div>



                            <div class="campo-formulario">

                                <label>
                                    Data de saída
                                </label>

                                <input
                                    type="text"
                                    id="saida-reserva"
                                    readonly>

                            </div>



                            <div class="campo-formulario">

                                <label>
                                    Quantidade de diárias
                                </label>

                                <input
                                    type="text"
                                    id="diarias-reserva"
                                    readonly>

                            </div>



                            <div class="campo-formulario">

                                <label>
                                    Valor da diária
                                </label>

                                <input
                                    type="text"
                                    id="valor-diaria"
                                    readonly>

                            </div>



                            <div class="campo-formulario">

                                <label>
                                    Valor total
                                </label>

                                <input
                                    type="text"
                                    id="valor-total"
                                    readonly>

                            </div>

                        </div>

                    </section>



                    <!-- DADOS DO PET -->

                    <section class="secao-formulario">

                        <h3>
                            Dados do Pet
                        </h3>


                        <div class="formulario-duas-colunas">


                            <div class="campo-formulario">

                                <label>
                                    Nome do pet
                                </label>

                                <input
                                    type="text"
                                    id="nome-pet"
                                    readonly>

                            </div>



                            <div class="campo-formulario">

                                <label>
                                    Tipo
                                </label>

                                <input
                                    type="text"
                                    id="tipo-pet"
                                    readonly>

                            </div>



                            <div class="campo-formulario">

                                <label>
                                    Raça
                                </label>

                                <input
                                    type="text"
                                    id="raca-pet"
                                    readonly>

                            </div>



                            <div class="campo-formulario">

                                <label>
                                    Porte
                                </label>

                                <input
                                    type="text"
                                    id="porte-pet"
                                    readonly>

                            </div>

                        </div>

                    </section>



                    <!-- PROPRIETÁRIO -->

                    <section class="secao-formulario">

                        <h3>
                            Proprietário
                        </h3>


                        <div class="formulario-duas-colunas">


                            <div class="campo-formulario">

                                <label>
                                    Nome do proprietário
                                </label>

                                <input
                                    type="text"
                                    id="nome-proprietario"
                                    readonly>

                            </div>



                            <div class="campo-formulario">

                                <label>
                                    E-mail
                                </label>

                                <input
                                    type="email"
                                    id="email-proprietario"
                                    readonly>

                            </div>



                            <div class="campo-formulario">

                                <label>
                                    Telefone
                                </label>

                                <input
                                    type="text"
                                    id="telefone-proprietario"
                                    readonly>

                            </div>

                        </div>

                    </section>



                    <!-- OBSERVAÇÕES -->

                    <section class="secao-formulario">

                        <h3>
                            Observações
                        </h3>


                        <div class="campo-formulario campo-completo">

                            <label>
                                Observações da reserva
                            </label>


                            <textarea
                                id="observacoes"
                                rows="4"
                                readonly>
                            </textarea>

                        </div>

                    </section>



                    <!-- FOTO DO PET -->

                    <section class="secao-formulario">

                        <h3>
                            Foto do Pet
                        </h3>


                        <div class="foto-pet">

                            <img
                                id="foto-pet"
                                src=""
                                alt="Foto do pet"
                                style="
                                    width: 180px;
                                    height: 180px;
                                    object-fit: cover;
                                    border-radius: 12px;
                                    display: block;
                                ">

                        </div>

                    </section>



                    <!-- COMPROVANTE -->

                    <section class="secao-formulario">

                        <h3>
                            Comprovante
                        </h3>


                        <div class="arquivo-comprovante">

                            <p id="comprovante">
                            </p>


                            <a href="#"
                                id="link-comprovante">

                                Visualizar comprovante

                            </a>

                        </div>

                    </section>



                    <!-- BOTÕES -->

                    <div class="botoes-formulario">


                        <a
                            id="botao-editar"
                            href="editar-reserva.html"
                            class="botao botao-salvar">

                            ✎ Editar

                        </a>


                        <a
                            href="reservas.html"
                            class="botao botao-cancelar">

                            ← Voltar

                        </a>

                    </div>


                </section>

            </main>

        </div>

    </div>



    <!-- DADOS DAS RESERVAS -->

    <script>

        const reservas = {


            // =====================================
            // RESERVA 001
            // =====================================

            "001": {

                id: "001",

                status: "Confirmada",

                entrada: "20/08/2026",

                saida: "25/08/2026",

                diarias: 5,

                valorDiaria: 80,

                valorTotal: 400,


                pet: {

                    nome: "Thor",

                    tipo: "Cachorro",

                    raca: "Golden Retriever",

                    porte: "Grande",

                    foto: "../img/Thor.png"

                },


                proprietario: {

                    nome: "Maria Silva",

                    email: "maria@email.com",

                    telefone: "(77) 99999-9999"

                },


                observacoes:
                    "Pet precisa receber alimentação duas vezes ao dia e realizar passeios durante a hospedagem.",


                comprovante:
                    "📄 comprovante-reserva-001.pdf"

            },


            // =====================================
            // RESERVA 002
            // =====================================

            "002": {

                id: "002",

                status: "Em andamento",

                entrada: "21/08/2026",

                saida: "24/08/2026",

                diarias: 3,

                valorDiaria: 80,

                valorTotal: 240,


                pet: {

                    nome: "Luna",

                    tipo: "Cachorro",

                    raca: "Shih-tzu",

                    porte: "Pequeno",

                    foto: "../img/Luna.png"

                },


                proprietario: {

                    nome: "João Santos",

                    email: "joao@email.com",

                    telefone: "(77) 98888-8888"

                },


                observacoes:
                    "Manter os cuidados habituais e oferecer alimentação conforme orientação do proprietário.",


                comprovante:
                    "📄 comprovante-reserva-002.pdf"

            },


            // =====================================
            // RESERVA 003
            // =====================================

            "003": {

                id: "003",

                status: "Finalizada",

                entrada: "15/08/2026",

                saida: "18/08/2026",

                diarias: 3,

                valorDiaria: 80,

                valorTotal: 240,


                pet: {

                    nome: "Mel",

                    tipo: "Gato",

                    raca: "Siamês",

                    porte: "Pequeno",

                    foto: "../img/Mel.png"

                },


                proprietario: {

                    nome: "Ana Oliveira",

                    email: "ana@email.com",

                    telefone: "(77) 97777-7777"

                },


                observacoes:
                    "Gato deve permanecer em ambiente tranquilo durante a hospedagem.",


                comprovante:
                    "📄 comprovante-reserva-003.pdf"

            },


            // =====================================
            // RESERVA 004
            // =====================================

            "004": {

                id: "004",

                status: "Agendada",

                entrada: "25/08/2026",

                saida: "30/08/2026",

                diarias: 5,

                valorDiaria: 80,

                valorTotal: 400,


                pet: {

                    nome: "Bob",

                    tipo: "Cachorro",

                    raca: "Beagle",

                    porte: "Médio",

                    foto: "../img/Bob.png"

                },


                proprietario: {

                    nome: "Gisele Teles",

                    email: "gisele@email.com",

                    telefone: "(77) 96666-6666"

                },


                observacoes:
                    "Manter rotina de alimentação e passeios durante a hospedagem.",


                comprovante:
                    "📄 comprovante-reserva-004.pdf"

            }

        };



        // =====================================
        // PEGAR RESERVA DA URL
        // =====================================

        const parametros =
            new URLSearchParams(
                window.location.search
            );


        const reservaSelecionada =
            parametros.get("reserva") || "001";



        // =====================================
        // LOCALIZAR RESERVA
        // =====================================

        const reserva =
            reservas[reservaSelecionada]
            || reservas["001"];



        // =====================================
        // DADOS DA RESERVA
        // =====================================

        document.getElementById(
            "id-reserva"
        ).value =
            reserva.id;


        document.getElementById(
            "status-reserva"
        ).value =
            reserva.status;


        document.getElementById(
            "entrada-reserva"
        ).value =
            reserva.entrada;


        document.getElementById(
            "saida-reserva"
        ).value =
            reserva.saida;


        document.getElementById(
            "diarias-reserva"
        ).value =
            reserva.diarias + " diárias";


        document.getElementById(
            "valor-diaria"
        ).value =
            "R$ " +
            reserva.valorDiaria.toFixed(2)
                .replace(".", ",");


        document.getElementById(
            "valor-total"
        ).value =
            "R$ " +
            reserva.valorTotal.toFixed(2)
                .replace(".", ",");



        // =====================================
        // DADOS DO PET
        // =====================================

        document.getElementById(
            "nome-pet"
        ).value =
            reserva.pet.nome;


        document.getElementById(
            "tipo-pet"
        ).value =
            reserva.pet.tipo;


        document.getElementById(
            "raca-pet"
        ).value =
            reserva.pet.raca;


        document.getElementById(
            "porte-pet"
        ).value =
            reserva.pet.porte;



        // =====================================
        // FOTO DO PET
        // =====================================

        const fotoPet =
            document.getElementById(
                "foto-pet"
            );


        fotoPet.src =
            reserva.pet.foto;


        fotoPet.alt =
            "Foto de " +
            reserva.pet.nome;



        // =====================================
        // PROPRIETÁRIO
        // =====================================

        document.getElementById(
            "nome-proprietario"
        ).value =
            reserva.proprietario.nome;


        document.getElementById(
            "email-proprietario"
        ).value =
            reserva.proprietario.email;


        document.getElementById(
            "telefone-proprietario"
        ).value =
            reserva.proprietario.telefone;



        // =====================================
        // OBSERVAÇÕES
        // =====================================

        document.getElementById(
            "observacoes"
        ).value =
            reserva.observacoes;



        // =====================================
        // COMPROVANTE
        // =====================================

        document.getElementById(
            "comprovante"
        ).textContent =
            reserva.comprovante;



        // =====================================
        // BOTÃO EDITAR
        // =====================================

        document.getElementById(
            "botao-editar"
        ).href =
            "editar-reserva.html?reserva="
            + reservaSelecionada;

    </script>


</body>

</html>
