<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet - Editar Pet</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <div class="layout">

        <!-- MENU LATERAL -->
        <aside class="menu-lateral">

            <h1>Hotel Pet</h1>

            <nav>

                <a href="pets.html" class="menu-ativo">
                    Pet
                </a>

                <a href="usuarios.html">
                    Usuário
                </a>

                <a href="configuracoes.html">
                    Configurações
                </a>

                <a href="reservas.html">
                    Reservas
                </a>

            </nav>

        </aside>


        <!-- CONTEÚDO -->
        <div class="conteudo">

            <!-- TOPO -->
            <header class="topo">

                <div></div>

                <a href="perfil.html" class="perfil-topo">

                    <span class="icone-usuario">
                        O
                    </span>

                    <span>
                        Gisele Teles
                    </span>

                </a>

            </header>


            <!-- CONTEÚDO PRINCIPAL -->
            <main>

                <!-- BREADCRUMB -->
                <p class="breadcrumb">

                    <a href="dashboard.html">
                        Home
                    </a>

                    /

                    <a href="pets.html">
                        Pets
                    </a>

                    / Editar Pet

                </p>


                <!-- CABEÇALHO -->
                <div class="cabecalho-pagina">

                    <h2>
                        Editar Pet
                    </h2>

                </div>


                <!-- FORMULÁRIO -->
                <section class="card">

                    <form
                        class="formulario-duas-colunas"
                        action="pets.html"
                        method="get"
                    >

                        <!-- FOTO ATUAL -->
                        <div class="campo-formulario">

                            <label>
                                Foto atual
                            </label>

                            <div class="foto-pet">

                                <img
                                    src="../img/Thor.png"
                                    alt="Foto de Thor"
                                    style="
                                        width: 180px;
                                        height: 180px;
                                        object-fit: cover;
                                        border-radius: 10px;
                                    "
                                >

                            </div>

                        </div>


                        <!-- NOME -->
                        <div class="campo-formulario">

                            <label for="nome">
                                Nome *
                            </label>

                            <input
                                type="text"
                                id="nome"
                                name="nome"
                                value="Thor"
                                required
                            >

                        </div>


                        <!-- TIPO -->
                        <div class="campo-formulario">

                            <label for="tipo">
                                Tipo *
                            </label>

                            <select
                                id="tipo"
                                name="tipo"
                                required
                            >

                                <option value="Cachorro" selected>
                                    Cachorro
                                </option>

                                <option value="Gato">
                                    Gato
                                </option>

                            </select>

                        </div>


                        <!-- RAÇA -->
                        <div class="campo-formulario">

                            <label for="raca">
                                Raça *
                            </label>

                            <input
                                type="text"
                                id="raca"
                                name="raca"
                                value="Golden Retriever"
                                required
                            >

                        </div>


                        <!-- PORTE -->
                        <div class="campo-formulario">

                            <label for="porte">
                                Porte *
                            </label>

                            <select
                                id="porte"
                                name="porte"
                                required
                            >

                                <option value="Pequeno">
                                    Pequeno
                                </option>

                                <option value="Médio">
                                    Médio
                                </option>

                                <option value="Grande" selected>
                                    Grande
                                </option>

                            </select>

                        </div>


                        <!-- PROPRIETÁRIO -->
                        <div class="campo-formulario">

                            <label for="proprietario">
                                Proprietário *
                            </label>

                            <select
                                id="proprietario"
                                name="proprietario"
                                required
                            >

                                <option value="Maria Silva" selected>
                                    Maria Silva
                                </option>

                                <option value="João Santos">
                                    João Santos
                                </option>

                                <option value="Ana Oliveira">
                                    Ana Oliveira
                                </option>

                                <option value="Gisele Teles">
                                    Gisele Teles
                                </option>

                            </select>

                        </div>


                        <!-- IDADE -->
                        <div class="campo-formulario">

                            <label for="idade">
                                Idade
                            </label>

                            <input
                                type="text"
                                id="idade"
                                name="idade"
                                value="3 anos"
                            >

                        </div>


                        <!-- PESO -->
                        <div class="campo-formulario">

                            <label for="peso">
                                Peso
                            </label>

                            <input
                                type="text"
                                id="peso"
                                name="peso"
                                value="30 kg"
                            >

                        </div>


                        <!-- ALTERAR FOTO -->
                        <div class="campo-formulario campo-completo">

                            <label for="foto">
                                Alterar foto
                            </label>

                            <input
                                type="file"
                                id="foto"
                                name="foto"
                                accept="image/*"
                            >

                        </div>


                        <!-- ALIMENTAÇÃO -->
                        <div class="campo-formulario campo-completo">

                            <label for="alimentacao">
                                Alimentação
                            </label>

                            <textarea
                                id="alimentacao"
                                name="alimentacao"
                                rows="4"
                            >Ração duas vezes ao dia.</textarea>

                        </div>


                        <!-- OBSERVAÇÕES -->
                        <div class="campo-formulario campo-completo">

                            <label for="observacoes">
                                Observações
                            </label>

                            <textarea
                                id="observacoes"
                                name="observacoes"
                                rows="4"
                            >Gosta de brincar e passear.</textarea>

                        </div>


                        <!-- BOTÕES -->
                        <div class="acoes-formulario campo-completo">

                            <button
                                type="submit"
                                class="botao botao-salvar"
                            >
                                Salvar
                            </button>


                            <button
                                type="reset"
                                class="botao botao-limpar"
                            >
                                Limpar
                            </button>


                            <a
                                href="visualizar-pet.html?pet=thor"
                                class="botao botao-cancelar"
                            >
                                Cancelar
                            </a>

                        </div>

                    </form>

                </section>

            </main>

        </div>

    </div>

</body>

</html>
