<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet - Editar Pet</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="layout">

        <!-- MENU LATERAL -->
        <aside class="menu-lateral">

            <h1>Hotel Pet</h1>

            <nav>

                <a href="pets.html" class="menu-ativo">
                    🐾 Pet
                </a>

                <a href="usuarios.html">
                    ♙ Usuário
                </a>

                <a href="configuracoes.html">
                    ⚙ Configurações
                </a>

                <a href="reservas.html">
                    ▣ Reservas
                </a>

            </nav>

        </aside>


        <!-- ÁREA PRINCIPAL -->
        <div class="conteudo">

            <!-- TOPO -->
            <header class="topo">

                <div></div>

                <div class="perfil-topo">

                    <span class="icone-usuario">
                        ◯
                    </span>

                    <span>
                        João da Silva
                    </span>

                </div>

            </header>


            <!-- CONTEÚDO -->
            <main>

                <p class="breadcrumb">
                    Home / Pets / Editar Pet
                </p>


                <section class="card">

                    <h2>
                        Editar Pet
                    </h2>


                    <form>

                        <!-- DADOS DO PET -->
                        <section class="secao-formulario">

                            <h3>
                                Dados do Pet
                            </h3>


                            <div class="formulario-duas-colunas">

                                <div class="campo-formulario">

                                    <label for="id-pet">
                                        ID
                                    </label>

                                    <input
                                        type="text"
                                        id="id-pet"
                                        name="id-pet"
                                        value="001"
                                        readonly>

                                </div>


                                <div class="campo-formulario">

                                    <label for="nome-pet">
                                        Nome do pet *
                                    </label>

                                    <input
                                        type="text"
                                        id="nome-pet"
                                        name="nome-pet"
                                        value="Thor"
                                        required>

                                </div>


                                <div class="campo-formulario">

                                    <label for="tipo">
                                        Tipo *
                                    </label>

                                    <select
                                        id="tipo"
                                        name="tipo"
                                        required>

                                        <option value="cachorro" selected>
                                            Cachorro
                                        </option>

                                        <option value="gato">
                                            Gato
                                        </option>

                                        <option value="outro">
                                            Outro
                                        </option>

                                    </select>

                                </div>


                                <div class="campo-formulario">

                                    <label for="raca">
                                        Raça
                                    </label>

                                    <input
                                        type="text"
                                        id="raca"
                                        name="raca"
                                        value="Golden Retriever">

                                </div>


                                <div class="campo-formulario">

                                    <label for="porte">
                                        Porte *
                                    </label>

                                    <select
                                        id="porte"
                                        name="porte"
                                        required>

                                        <option value="pequeno">
                                            Pequeno
                                        </option>

                                        <option value="medio">
                                            Médio
                                        </option>

                                        <option value="grande" selected>
                                            Grande
                                        </option>

                                    </select>

                                </div>


                                <div class="campo-formulario">

                                    <label for="idade">
                                        Idade
                                    </label>

                                    <input
                                        type="number"
                                        id="idade"
                                        name="idade"
                                        value="3"
                                        min="0">

                                </div>


                                <div class="campo-formulario">

                                    <label for="peso">
                                        Peso
                                    </label>

                                    <input
                                        type="text"
                                        id="peso"
                                        name="peso"
                                        value="28 kg">

                                </div>

                            </div>

                        </section>


                        <!-- PROPRIETÁRIO -->
                        <section class="secao-formulario">

                            <h3>
                                Proprietário
                            </h3>


                            <div class="formulario-duas-colunas">

                                <div class="campo-formulario">

                                    <label for="proprietario">
                                        Proprietário *
                                    </label>

                                    <select
                                        id="proprietario"
                                        name="proprietario"
                                        required>

                                        <option value="maria" selected>
                                            Maria Silva
                                        </option>

                                        <option value="joao">
                                            João Santos
                                        </option>

                                        <option value="ana">
                                            Ana Oliveira
                                        </option>

                                        <option value="carlos">
                                            Carlos Souza
                                        </option>

                                    </select>

                                </div>

                            </div>

                        </section>


                        <!-- CUIDADOS -->
                        <section class="secao-formulario">

                            <h3>
                                Cuidados e Observações
                            </h3>


                            <div class="formulario-duas-colunas">

                                <div class="campo-formulario campo-completo">

                                    <label for="alimentacao">
                                        Alimentação
                                    </label>

                                    <textarea
                                        id="alimentacao"
                                        name="alimentacao"
                                        rows="4">Ração duas vezes ao dia, pela manhã e à noite.</textarea>

                                </div>


                                <div class="campo-formulario campo-completo">

                                    <label for="observacoes">
                                        Observações
                                    </label>

                                    <textarea
                                        id="observacoes"
                                        name="observacoes"
                                        rows="4">Pet dócil. Gosta de brincar e precisa de passeios durante a hospedagem.</textarea>

                                </div>

                            </div>

                        </section>


                        <!-- FOTO -->
                        <section class="secao-formulario">

                            <h3>
                                Foto do Pet
                            </h3>


                            <div class="campo-formulario">

                                <label for="foto">
                                    Alterar foto
                                </label>

                                <input
                                    type="file"
                                    id="foto"
                                    name="foto"
                                    accept="image/*">

                            </div>

                        </section>


                        <!-- BOTÕES -->
                        <div class="botoes-formulario">

                            <button
                                type="submit"
                                class="botao botao-salvar">
                                💾 Salvar
                            </button>


                            <button
                                type="reset"
                                class="botao botao-limpar">
                                ↻ Limpar
                            </button>


                            <a
                                href="pets.html"
                                class="botao botao-cancelar">
                                ← Cancelar
                            </a>

                        </div>

                    </form>

                </section>

            </main>

        </div>

    </div>

</body>

</html>
