<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet - Editar Pet</title>

</head>

<body>

    <header>

        <h1>Hotel Pet</h1>

        <p>Área do Gerente</p>


        <nav>

            <a href="dashboard.html">
                Início
            </a>

            |

            <a href="reservas.html">
                Reservas
            </a>

            |

            <a href="pets.html">
                Pets
            </a>

            |

            <a href="usuarios.html">
                Usuários
            </a>

            |

            <a href="configuracoes.html">
                Configurações
            </a>

            |

            <a href="perfil.html">
                Meu Perfil
            </a>

            |

            <a href="../index.html">
                Sair
            </a>

        </nav>

    </header>


    <main>

        <h2>Editar Pet</h2>


        <form>


            <section>

                <h3>Informações do Pet</h3>


                <div>

                    <label for="codigo">
                        Código:
                    </label>

                    <input
                        type="text"
                        id="codigo"
                        name="codigo"
                        value="001"
                        readonly
                    >

                </div>


                <br>


                <div>

                    <label for="nome">
                        Nome do Pet:
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        value="Thor"
                        required
                    >

                </div>


                <br>


                <div>

                    <label for="tipo">
                        Tipo de Animal:
                    </label>

                    <select
                        id="tipo"
                        name="tipo"
                        required
                    >

                        <option value="cachorro" selected>
                            Cachorro
                        </option>

                        <option value="gato">
                            Gato
                        </option>

                        <option value="outro">
                            Outro
                        </option>

                    </select>

                </div>


                <br>


                <div>

                    <label for="raca">
                        Raça:
                    </label>

                    <input
                        type="text"
                        id="raca"
                        name="raca"
                        value="Golden Retriever"
                        required
                    >

                </div>


                <br>


                <div>

                    <label for="idade">
                        Idade:
                    </label>

                    <input
                        type="number"
                        id="idade"
                        name="idade"
                        value="4"
                        min="0"
                        max="30"
                        required
                    >

                </div>


                <br>


                <div>

                    <label for="tamanho">
                        Tamanho:
                    </label>

                    <select
                        id="tamanho"
                        name="tamanho"
                        required
                    >

                        <option value="pequeno">
                            Pequeno
                        </option>

                        <option value="medio">
                            Médio
                        </option>

                        <option value="grande" selected>
                            Grande
                        </option>

                    </select>

                </div>


                <br>


                <div>

                    <label for="sexo">
                        Sexo:
                    </label>

                    <select
                        id="sexo"
                        name="sexo"
                        required
                    >

                        <option value="macho" selected>
                            Macho
                        </option>

                        <option value="femea">
                            Fêmea
                        </option>

                    </select>

                </div>

            </section>


            <section>

                <h3>Informações do Proprietário</h3>


                <div>

                    <label for="proprietario">
                        Proprietário:
                    </label>

                    <input
                        type="text"
                        id="proprietario"
                        name="proprietario"
                        value="Maria Silva"
                        required
                    >

                </div>


                <br>


                <div>

                    <label for="email">
                        E-mail:
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="maria@email.com"
                        required
                    >

                </div>


                <br>


                <div>

                    <label for="telefone">
                        Telefone:
                    </label>

                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        value="(77) 99999-9999"
                        required
                    >

                </div>

            </section>


            <section>

                <h3>Cuidados e Observações</h3>


                <div>

                    <label for="alimentacao">
                        Alimentação:
                    </label>

                    <br>

                    <textarea
                        id="alimentacao"
                        name="alimentacao"
                        rows="4"
                        cols="50"
                    >Ração duas vezes ao dia, pela manhã e à noite.</textarea>

                </div>


                <br>


                <div>

                    <label for="observacoes">
                        Observações:
                    </label>

                    <br>

                    <textarea
                        id="observacoes"
                        name="observacoes"
                        rows="5"
                        cols="50"
                    >Thor é tranquilo, gosta de brincar e não apresenta restrições para atividades.</textarea>

                </div>

            </section>


            <section>

                <h3>Foto do Pet</h3>


                <div>

                    <label for="foto">
                        Alterar foto:
                    </label>

                    <input
                        type="file"
                        id="foto"
                        name="foto"
                        accept="image/*"
                    >

                </div>

            </section>


            <section>

                <br>

                <button type="submit">
                    Salvar Alterações
                </button>


                <button type="reset">
                    Restaurar
                </button>


                <br><br>


                <a href="pets.html">
                    Cancelar
                </a>

            </section>


        </form>

    </main>


    <footer>

        <p>
            &copy; 2026 Hotel Pet
        </p>

    </footer>

</body>

</html>
