<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet - Editar Pet</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="layout">

        <!-- MENU LATERAL -->
        <aside class="menu-lateral">

            <h1>Hotel Pet</h1>

            <nav>

                <a href="pets.html" class="menu-ativo">
                    🐾 Pet
                </a>

                <a href="usuarios.html">
                    ♙ Usuário
                </a>

                <a href="configuracoes.html">
                    ⚙ Configurações
                </a>

                <a href="reservas.html">
                    ▣ Reservas
                </a>

            </nav>

        </aside>


        <!-- CONTEÚDO -->
        <div class="conteudo">

            <!-- TOPO -->
            <header class="topo">

                <div></div>

                <a href="perfil.html" class="perfil-topo">

                    <span class="icone-usuario">
                        ◯
                    </span>

                    <span>
                        Gisele Teles
                    </span>

                </a>

            </header>


            <!-- CONTEÚDO PRINCIPAL -->
            <main>

                <p class="breadcrumb">

                    <a href="dashboard.html">
                        Home
                    </a>

                    /

                    <a href="pets.html">
                        Pets
                    </a>

                    / Editar Pet

                </p>


                <div class="cabecalho-pagina">

                    <h2>
                        Editar Pet
                    </h2>

                </div>


                <!-- CARD -->
                <section class="card">

                    <form
                        id="formulario-pet"
                        class="formulario-duas-colunas"
                    >

                        <!-- FOTO -->
                        <div class="campo-formulario">

                            <label>
                                Foto atual
                            </label>

                            <div class="foto-pet">

                                <img
                                    id="foto-atual"
                                    src="../img/Thor.png"
                                    alt="Foto do pet"
                                    style="
                                        width: 180px;
                                        height: 180px;
                                        object-fit: cover;
                                        border-radius: 10px;
                                    "
                                >

                            </div>

                        </div>


                        <!-- NOME -->
                        <div class="campo-formulario">

                            <label for="nome">
                                Nome *
                            </label>

                            <input
                                type="text"
                                id="nome"
                                name="nome"
                                required
                            >

                        </div>


                        <!-- TIPO -->
                        <div class="campo-formulario">

                            <label for="tipo">
                                Tipo *
                            </label>

                            <select
                                id="tipo"
                                name="tipo"
                                required
                            >

                                <option value="Cachorro">
                                    Cachorro
                                </option>

                                <option value="Gato">
                                    Gato
                                </option>

                            </select>

                        </div>


                        <!-- RAÇA -->
                        <div class="campo-formulario">

                            <label for="raca">
                                Raça *
                            </label>

                            <input
                                type="text"
                                id="raca"
                                name="raca"
                                required
                            >

                        </div>


                        <!-- PORTE -->
                        <div class="campo-formulario">

                            <label for="porte">
                                Porte *
                            </label>

                            <select
                                id="porte"
                                name="porte"
                                required
                            >

                                <option value="Pequeno">
                                    Pequeno
                                </option>

                                <option value="Médio">
                                    Médio
                                </option>

                                <option value="Grande">
                                    Grande
                                </option>

                            </select>

                        </div>


                        <!-- PROPRIETÁRIO -->
                        <div class="campo-formulario">

                            <label for="proprietario">
                                Proprietário *
                            </label>

                            <select
                                id="proprietario"
                                name="proprietario"
                                required
                            >

                                <option value="Maria Silva">
                                    Maria Silva
                                </option>

                                <option value="João Santos">
                                    João Santos
                                </option>

                                <option value="Ana Oliveira">
                                    Ana Oliveira
                                </option>

                                <option value="Gisele Teles">
                                    Gisele Teles
                                </option>

                            </select>

                        </div>


                        <!-- IDADE -->
                        <div class="campo-formulario">

                            <label for="idade">
                                Idade
                            </label>

                            <input
                                type="text"
                                id="idade"
                                name="idade"
                            >

                        </div>


                        <!-- PESO -->
                        <div class="campo-formulario">

                            <label for="peso">
                                Peso
                            </label>

                            <input
                                type="text"
                                id="peso"
                                name="peso"
                            >

                        </div>


                        <!-- NOVA FOTO -->
                        <div class="campo-formulario campo-completo">

                            <label for="foto">
                                Alterar foto
                            </label>

                            <input
                                type="file"
                                id="foto"
                                name="foto"
                                accept="image/*"
                            >

                        </div>


                        <!-- ALIMENTAÇÃO -->
                        <div class="campo-formulario campo-completo">

                            <label for="alimentacao">
                                Alimentação
                            </label>

                            <textarea
                                id="alimentacao"
                                name="alimentacao"
                                rows="4"
                            ></textarea>

                        </div>


                        <!-- OBSERVAÇÕES -->
                        <div class="campo-formulario campo-completo">

                            <label for="observacoes">
                                Observações
                            </label>

                            <textarea
                                id="observacoes"
                                name="observacoes"
                                rows="4"
                            ></textarea>

                        </div>


                        <!-- BOTÕES -->
                        <div class="acoes-formulario campo-completo">

                            <button
                                type="submit"
                                class="botao botao-salvar"
                            >
                                💾 Salvar
                            </button>


                            <button
                                type="reset"
                                class="botao botao-limpar"
                            >
                                ↻ Limpar
                            </button>


                            <a
                                id="botao-cancelar"
                                href="pets.html"
                                class="botao botao-cancelar"
                            >
                                Cancelar
                            </a>

                        </div>

                    </form>

                </section>

            </main>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script>

        const pets = {

            thor: {
                nome: "Thor",
                tipo: "Cachorro",
                raca: "Golden Retriever",
                porte: "Grande",
                proprietario: "Maria Silva",
                idade: "3 anos",
                peso: "30 kg",
                alimentacao: "Ração duas vezes ao dia.",
                observacoes: "Gosta de brincar e passear.",
                foto: "../img/Thor.png"
            },

            luna: {
                nome: "Luna",
                tipo: "Cachorro",
                raca: "Shih-tzu",
                porte: "Pequeno",
                proprietario: "João Santos",
                idade: "2 anos",
                peso: "6 kg",
                alimentacao: "Ração duas vezes ao dia.",
                observacoes: "Pet tranquila e dócil.",
                foto: "../img/Luna.png"
            },

            mel: {
                nome: "Mel",
                tipo: "Gato",
                raca: "Siamês",
                porte: "Pequeno",
                proprietario: "Ana Oliveira",
                idade: "2 anos",
                peso: "4 kg",
                alimentacao: "Ração para gatos duas vezes ao dia.",
                observacoes: "Gosta de ambientes tranquilos.",
                foto: "../img/Mel.png"
            },

            bob: {
                nome: "Bob",
                tipo: "Cachorro",
                raca: "Beagle",
                porte: "Médio",
                proprietario: "Gisele Teles",
                idade: "4 anos",
                peso: "12 kg",
                alimentacao: "Ração duas vezes ao dia.",
                observacoes: "Pet ativo e brincalhão.",
                foto: "../img/Bob.png"
            }

        };


        const parametros =
            new URLSearchParams(
                window.location.search
            );


        const petSelecionado =
            parametros.get("pet") || "thor";


        const pet =
            pets[petSelecionado] || pets.thor;


        // PREENCHER FORMULÁRIO

        document.getElementById("nome").value =
            pet.nome;

        document.getElementById("tipo").value =
            pet.tipo;

        document.getElementById("raca").value =
            pet.raca;

        document.getElementById("porte").value =
            pet.porte;

        document.getElementById("proprietario").value =
            pet.proprietario;

        document.getElementById("idade").value =
            pet.idade;

        document.getElementById("peso").value =
            pet.peso;

        document.getElementById("alimentacao").value =
            pet.alimentacao;

        document.getElementById("observacoes").value =
            pet.observacoes;

        document.getElementById("foto-atual").src =
            pet.foto;

        document.getElementById("foto-atual").alt =
            "Foto de " + pet.nome;


        // CANCELAR

        document.getElementById("botao-cancelar").href =
            "visualizar-pet.html?pet=" + petSelecionado;


        // PRÉ-VISUALIZAÇÃO DA NOVA FOTO

        const campoFoto =
            document.getElementById("foto");

        const fotoAtual =
            document.getElementById("foto-atual");


        campoFoto.addEventListener(
            "change",
            function () {

                const arquivo =
                    this.files[0];

                if (!arquivo) {
                    return;
                }

                const leitor =
                    new FileReader();

                leitor.onload =
                    function (evento) {

                        fotoAtual.src =
                            evento.target.result;

                    };

                leitor.readAsDataURL(
                    arquivo
                );

            }
        );


        // SALVAR

        document
            .getElementById("formulario-pet")
            .addEventListener(
                "submit",
                function (evento) {

                    evento.preventDefault();

                    alert(
                        "Pet atualizado com sucesso!"
                    );

                }
            );


        // LIMPAR

        document
            .getElementById("formulario-pet")
            .addEventListener(
                "reset",
                function () {

                    setTimeout(
                        function () {

                            document.getElementById(
                                "nome"
                            ).value = pet.nome;

                            document.getElementById(
                                "tipo"
                            ).value = pet.tipo;

                            document.getElementById(
                                "raca"
                            ).value = pet.raca;

                            document.getElementById(
                                "porte"
                            ).value = pet.porte;

                            document.getElementById(
                                "proprietario"
                            ).value =
                                pet.proprietario;

                            document.getElementById(
                                "idade"
                            ).value = pet.idade;

                            document.getElementById(
                                "peso"
                            ).value = pet.peso;

                            document.getElementById(
                                "alimentacao"
                            ).value =
                                pet.alimentacao;

                            document.getElementById(
                                "observacoes"
                            ).value =
                                pet.observacoes;

                            document.getElementById(
                                "foto-atual"
                            ).src =
                                pet.foto;

                            campoFoto.value = "";

                        },
                        0
                    );

                }
            );

    </script>

</body>

</html>
