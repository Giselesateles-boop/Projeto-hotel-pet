
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Visualizar Pet</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="layout">
        <aside class="menu-lateral">
            <h1>Hotel Pet</h1>
            <nav>
                <a href="pets.html" class="menu-ativo">Pet</a>
                <a href="usuarios.html">Usuário</a>
                <a href="configuracoes.html">Configurações</a>
                <a href="reservas.html">Reservas</a>
            </nav>
        </aside>

        <div class="conteudo">
            <header class="topo">
                <div></div>
                <a href="perfil.html" class="perfil-topo">
                    <span class="icone-usuario">O</span>
                    <span>Gisele Teles</span>
                </a>
            </header>

            <main>
                <p class="breadcrumb">
                    <a href="dashboard.html">Home</a> /
                    <a href="pets.html">Pets</a> /
                    Visualizar Pet
                </p>

                <div class="cabecalho-pagina">
                    <h2>Visualizar Pet</h2>
                </div>

                <section class="card">
                    <h3 id="titulo-pet">Dados do Pet</h3>

                    <div class="formulario-duas-colunas">
                        <div class="campo-formulario">
                            <label>Foto</label>
                            <div class="foto-pet">
                                <img id="foto-pet" src="../img/Thor.png"
                                    alt="Foto do pet"
                                    style="width:180px;height:180px;object-fit:cover;border-radius:10px;">
                            </div>
                        </div>

                        <div class="campo-formulario">
                            <label>Nome</label>
                            <input id="nome-pet" type="text" readonly>
                        </div>

                        <div class="campo-formulario">
                            <label>Tipo</label>
                            <input id="tipo-pet" type="text" readonly>
                        </div>

                        <div class="campo-formulario">
                            <label>Raça</label>
                            <input id="raca-pet" type="text" readonly>
                        </div>

                        <div class="campo-formulario">
                            <label>Porte</label>
                            <input id="porte-pet" type="text" readonly>
                        </div>

                        <div class="campo-formulario">
                            <label>Proprietário</label>
                            <input id="proprietario-pet" type="text" readonly>
                        </div>

                        <div class="campo-formulario">
                            <label>Idade</label>
                            <input id="idade-pet" type="text" readonly>
                        </div>

                        <div class="campo-formulario">
                            <label>Peso</label>
                            <input id="peso-pet" type="text" readonly>
                        </div>

                        <div class="campo-formulario campo-completo">
                            <label>Alimentação</label>
                            <textarea id="alimentacao-pet" rows="3" readonly></textarea>
                        </div>

                        <div class="campo-formulario campo-completo">
                            <label>Observações</label>
                            <textarea id="observacoes-pet" rows="4" readonly></textarea>
                        </div>
                    </div>

                    <div class="acoes-formulario">
                        <a id="botao-editar" href="editar-pet.html"
                            class="botao botao-salvar">Editar</a>
                        <a href="pets.html"
                            class="botao botao-cancelar">Voltar</a>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="../js/navegacao.js"></script>
    <script>
        const pets = {
            thor: {
                nome: "Thor",
                tipo: "Cachorro",
                raca: "Golden Retriever",
                porte: "Grande",
                proprietario: "Maria Silva",
                idade: "3 anos",
                peso: "30 kg",
                alimentacao: "Ração duas vezes ao dia.",
                observacoes: "Gosta de brincar e passear.",
                foto: "../img/Thor.png"
            },
            luna: {
                nome: "Luna",
                tipo: "Cachorro",
                raca: "Shih-tzu",
                porte: "Pequeno",
                proprietario: "João Santos",
                idade: "2 anos",
                peso: "6 kg",
                alimentacao: "Ração duas vezes ao dia.",
                observacoes: "É tranquila e gosta de colo.",
                foto: "../img/Luna.png"
            },
            mel: {
                nome: "Mel",
                tipo: "Gato",
                raca: "Siamês",
                porte: "Pequeno",
                proprietario: "Ana Oliveira",
                idade: "2 anos",
                peso: "4 kg",
                alimentacao: "Ração para gatos duas vezes ao dia.",
                observacoes: "Gosta de descansar em lugares tranquilos.",
                foto: "../img/Mel.png"
            },
            bob: {
                nome: "Bob",
                tipo: "Cachorro",
                raca: "Beagle",
                porte: "Médio",
                proprietario: "Gisele Teles",
                idade: "4 anos",
                peso: "12 kg",
                alimentacao: "Ração duas vezes ao dia.",
                observacoes: "Gosta de passear e brincar.",
                foto: "../img/Bob.png"
            }
        };

        const parametros = new URLSearchParams(window.location.search);
        const identificador = (parametros.get("pet") || "thor").toLowerCase();
        const pet = pets[identificador];

        if (pet) {
            document.getElementById("titulo-pet").textContent =
                "Dados do Pet - " + pet.nome;

            document.getElementById("foto-pet").src = pet.foto;
            document.getElementById("foto-pet").alt = "Foto de " + pet.nome;

            document.getElementById("nome-pet").value = pet.nome;
            document.getElementById("tipo-pet").value = pet.tipo;
            document.getElementById("raca-pet").value = pet.raca;
            document.getElementById("porte-pet").value = pet.porte;
            document.getElementById("proprietario-pet").value = pet.proprietario;
            document.getElementById("idade-pet").value = pet.idade;
            document.getElementById("peso-pet").value = pet.peso;
            document.getElementById("alimentacao-pet").value = pet.alimentacao;
            document.getElementById("observacoes-pet").value = pet.observacoes;

            document.getElementById("botao-editar").href =
                "editar-pet.html?pet=" + encodeURIComponent(identificador);
        } else {
            document.getElementById("titulo-pet").textContent =
                "Pet não encontrado";

            document.getElementById("foto-pet").hidden = true;
            document.getElementById("botao-editar").hidden = true;
        }
    </script>
</body>
</html>
