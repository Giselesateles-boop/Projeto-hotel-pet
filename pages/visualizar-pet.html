<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet - Visualizar Pet</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="layout">

        <!-- MENU LATERAL -->
        <aside class="menu-lateral">

            <h1>Hotel Pet</h1>

            <nav>

                <a href="pets.html" class="menu-ativo">
                    🐾 Pet
                </a>

                <a href="usuarios.html">
                    ♙ Usuário
                </a>

                <a href="configuracoes.html">
                    ⚙ Configurações
                </a>

                <a href="reservas.html">
                    ▣ Reservas
                </a>

            </nav>

        </aside>


        <!-- CONTEÚDO -->
        <div class="conteudo">

            <!-- TOPO -->
            <header class="topo">

                <div></div>

                <a href="perfil.html" class="perfil-topo">

                    <span class="icone-usuario">
                        ◯
                    </span>

                    <span>
                        Gisele Teles
                    </span>

                </a>

            </header>


            <!-- CONTEÚDO PRINCIPAL -->
            <main>

                <p class="breadcrumb">

                    <a href="dashboard.html">
                        Home
                    </a>

                    /

                    <a href="pets.html">
                        Pets
                    </a>

                    / Visualizar Pet

                </p>


                <div class="cabecalho-pagina">

                    <h2>
                        Visualizar Pet
                    </h2>

                </div>


                <!-- CARD -->
                <section class="card">

                    <h3 id="titulo-pet">
                        Dados do Pet
                    </h3>


                    <div class="formulario-duas-colunas">

                        <!-- FOTO -->
                        <div class="campo-formulario">

                            <label>
                                Foto
                            </label>

                            <div class="foto-pet">

                                <img
                                    id="foto-pet"
                                    src="../img/Thor.png"
                                    alt="Foto do pet"
                                    style="
                                        width: 180px;
                                        height: 180px;
                                        object-fit: cover;
                                        border-radius: 10px;
                                    "
                                >

                            </div>

                        </div>


                        <!-- NOME -->
                        <div class="campo-formulario">

                            <label>
                                Nome
                            </label>

                            <input
                                type="text"
                                id="nome"
                                readonly
                            >

                        </div>


                        <!-- TIPO -->
                        <div class="campo-formulario">

                            <label>
                                Tipo
                            </label>

                            <input
                                type="text"
                                id="tipo"
                                readonly
                            >

                        </div>


                        <!-- RAÇA -->
                        <div class="campo-formulario">

                            <label>
                                Raça
                            </label>

                            <input
                                type="text"
                                id="raca"
                                readonly
                            >

                        </div>


                        <!-- PORTE -->
                        <div class="campo-formulario">

                            <label>
                                Porte
                            </label>

                            <input
                                type="text"
                                id="porte"
                                readonly
                            >

                        </div>


                        <!-- PROPRIETÁRIO -->
                        <div class="campo-formulario">

                            <label>
                                Proprietário
                            </label>

                            <input
                                type="text"
                                id="proprietario"
                                readonly
                            >

                        </div>


                        <!-- IDADE -->
                        <div class="campo-formulario">

                            <label>
                                Idade
                            </label>

                            <input
                                type="text"
                                id="idade"
                                readonly
                            >

                        </div>


                        <!-- PESO -->
                        <div class="campo-formulario">

                            <label>
                                Peso
                            </label>

                            <input
                                type="text"
                                id="peso"
                                readonly
                            >

                        </div>


                        <!-- ALIMENTAÇÃO -->
                        <div class="campo-formulario campo-completo">

                            <label>
                                Alimentação
                            </label>

                            <textarea
                                id="alimentacao"
                                rows="3"
                                readonly
                            ></textarea>

                        </div>


                        <!-- OBSERVAÇÕES -->
                        <div class="campo-formulario campo-completo">

                            <label>
                                Observações
                            </label>

                            <textarea
                                id="observacoes"
                                rows="4"
                                readonly
                            ></textarea>

                        </div>

                    </div>


                    <!-- BOTÕES -->
                    <div class="acoes-formulario">

                        <a
                            id="botao-editar"
                            href="editar-pet.html?pet=thor"
                            class="botao botao-salvar"
                        >
                            ✏️ Editar
                        </a>

                        <a
                            href="pets.html"
                            class="botao botao-cancelar"
                        >
                            Voltar
                        </a>

                    </div>

                </section>

            </main>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script>

        const pets = {

            thor: {
                nome: "Thor",
                tipo: "Cachorro",
                raca: "Golden Retriever",
                porte: "Grande",
                proprietario: "Maria Silva",
                idade: "3 anos",
                peso: "30 kg",
                alimentacao: "Ração duas vezes ao dia.",
                observacoes: "Gosta de brincar e passear.",
                foto: "../img/Thor.png"
            },

            luna: {
                nome: "Luna",
                tipo: "Cachorro",
                raca: "Shih-tzu",
                porte: "Pequeno",
                proprietario: "João Santos",
                idade: "2 anos",
                peso: "6 kg",
                alimentacao: "Ração duas vezes ao dia.",
                observacoes: "Pet tranquila e dócil.",
                foto: "../img/Luna.png"
            },

            mel: {
                nome: "Mel",
                tipo: "Gato",
                raca: "Siamês",
                porte: "Pequeno",
                proprietario: "Ana Oliveira",
                idade: "2 anos",
                peso: "4 kg",
                alimentacao: "Ração para gatos duas vezes ao dia.",
                observacoes: "Gosta de ambientes tranquilos.",
                foto: "../img/Mel.png"
            },

            bob: {
                nome: "Bob",
                tipo: "Cachorro",
                raca: "Beagle",
                porte: "Médio",
                proprietario: "Gisele Teles",
                idade: "4 anos",
                peso: "12 kg",
                alimentacao: "Ração duas vezes ao dia.",
                observacoes: "Pet ativo e brincalhão.",
                foto: "../img/Bob.png"
            }

        };


        const parametros =
            new URLSearchParams(
                window.location.search
            );


        const petSelecionado =
            parametros.get("pet") || "thor";


        const pet =
            pets[petSelecionado] || pets.thor;


        document.getElementById("nome").value =
            pet.nome;

        document.getElementById("tipo").value =
            pet.tipo;

        document.getElementById("raca").value =
            pet.raca;

        document.getElementById("porte").value =
            pet.porte;

        document.getElementById("proprietario").value =
            pet.proprietario;

        document.getElementById("idade").value =
            pet.idade;

        document.getElementById("peso").value =
            pet.peso;

        document.getElementById("alimentacao").value =
            pet.alimentacao;

        document.getElementById("observacoes").value =
            pet.observacoes;

        document.getElementById("foto-pet").src =
            pet.foto;

        document.getElementById("foto-pet").alt =
            "Foto de " + pet.nome;

        document.getElementById("titulo-pet").textContent =
            "Dados do Pet - " + pet.nome;

        document.getElementById("botao-editar").href =
            "editar-pet.html?pet=" + petSelecionado;

    </script>

</body>

</html>
