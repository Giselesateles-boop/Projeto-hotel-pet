<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet - Visualizar Pet</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <div class="layout">

        <!-- MENU LATERAL -->
        <aside class="menu-lateral">

            <h1>Hotel Pet</h1>

            <nav>

                <a href="pets.html" class="menu-ativo">
                    Pet
                </a>

                <a href="usuarios.html">
                    Usuário
                </a>

                <a href="configuracoes.html">
                    Configurações
                </a>

                <a href="reservas.html">
                    Reservas
                </a>

            </nav>

        </aside>


        <!-- CONTEÚDO -->
        <div class="conteudo">

            <!-- TOPO -->
            <header class="topo">

                <div></div>

                <a href="perfil.html" class="perfil-topo">

                    <span class="icone-usuario">
                        O
                    </span>

                    <span>
                        Gisele Teles
                    </span>

                </a>

            </header>


            <!-- CONTEÚDO PRINCIPAL -->
            <main>

                <!-- BREADCRUMB -->
                <p class="breadcrumb">

                    <a href="dashboard.html">
                        Home
                    </a>

                    /

                    <a href="pets.html">
                        Pets
                    </a>

                    / Visualizar Pet

                </p>


                <!-- CABEÇALHO -->
                <div class="cabecalho-pagina">

                    <h2>
                        Visualizar Pet
                    </h2>

                </div>


                <!-- CARD -->
                <section class="card">

                    <h3>
                        Dados do Pet - Thor
                    </h3>


                    <div class="formulario-duas-colunas">

                        <!-- FOTO -->
                        <div class="campo-formulario">

                            <label>
                                Foto
                            </label>

                            <div class="foto-pet">

                                <img
                                    src="../img/Thor.png"
                                    alt="Foto de Thor"
                                    style="
                                        width: 180px;
                                        height: 180px;
                                        object-fit: cover;
                                        border-radius: 10px;
                                    "
                                >

                            </div>

                        </div>


                        <!-- NOME -->
                        <div class="campo-formulario">

                            <label>
                                Nome
                            </label>

                            <input
                                type="text"
                                value="Thor"
                                readonly
                            >

                        </div>


                        <!-- TIPO -->
                        <div class="campo-formulario">

                            <label>
                                Tipo
                            </label>

                            <input
                                type="text"
                                value="Cachorro"
                                readonly
                            >

                        </div>


                        <!-- RAÇA -->
                        <div class="campo-formulario">

                            <label>
                                Raça
                            </label>

                            <input
                                type="text"
                                value="Golden Retriever"
                                readonly
                            >

                        </div>


                        <!-- PORTE -->
                        <div class="campo-formulario">

                            <label>
                                Porte
                            </label>

                            <input
                                type="text"
                                value="Grande"
                                readonly
                            >

                        </div>


                        <!-- PROPRIETÁRIO -->
                        <div class="campo-formulario">

                            <label>
                                Proprietário
                            </label>

                            <input
                                type="text"
                                value="Maria Silva"
                                readonly
                            >

                        </div>


                        <!-- IDADE -->
                        <div class="campo-formulario">

                            <label>
                                Idade
                            </label>

                            <input
                                type="text"
                                value="3 anos"
                                readonly
                            >

                        </div>


                        <!-- PESO -->
                        <div class="campo-formulario">

                            <label>
                                Peso
                            </label>

                            <input
                                type="text"
                                value="30 kg"
                                readonly
                            >

                        </div>


                        <!-- ALIMENTAÇÃO -->
                        <div class="campo-formulario campo-completo">

                            <label>
                                Alimentação
                            </label>

                            <textarea
                                rows="3"
                                readonly
                            >Ração duas vezes ao dia.</textarea>

                        </div>


                        <!-- OBSERVAÇÕES -->
                        <div class="campo-formulario campo-completo">

                            <label>
                                Observações
                            </label>

                            <textarea
                                rows="4"
                                readonly
                            >Gosta de brincar e passear.</textarea>

                        </div>

                    </div>


                    <!-- BOTÕES -->
                    <div class="acoes-formulario">

                        <a
                            href="editar-pet.html"
                            class="botao botao-salvar"
                        >
                            Editar
                        </a>


                        <a
                            href="pets.html"
                            class="botao botao-cancelar"
                        >
                            Voltar
                        </a>

                    </div>

                </section>

            </main>

        </div>

    </div>

</body>

</html>
