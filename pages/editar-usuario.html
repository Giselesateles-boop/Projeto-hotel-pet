<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet - Editar Usuário</title>

</head>

<body>

    <header>

        <h1>Hotel Pet</h1>

        <p>Área do Gerente</p>

        <nav>

            <a href="dashboard.html">Início</a>
            |
            <a href="reservas.html">Reservas</a>
            |
            <a href="pets.html">Pets</a>
            |
            <a href="usuarios.html">Usuários</a>
            |
            <a href="configuracoes.html">Configurações</a>
            |
            <a href="perfil.html">Meu Perfil</a>
            |
            <a href="../index.html">Sair</a>

        </nav>

    </header>


    <main>

        <h2>Editar Usuário</h2>


        <form>

            <section>

                <h3>Dados Pessoais</h3>

                <div>

                    <label for="codigo">
                        Código:
                    </label>

                    <input
                        type="text"
                        id="codigo"
                        name="codigo"
                        value="001"
                        readonly
                    >

                </div>

                <br>

                <div>

                    <label for="nome">
                        Nome completo:
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        value="Maria Silva"
                        required
                    >

                </div>

                <br>

                <div>

                    <label for="cpf">
                        CPF:
                    </label>

                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        value="123.456.789-00"
                        required
                    >

                </div>

                <br>

                <div>

                    <label for="nascimento">
                        Data de nascimento:
                    </label>

                    <input
                        type="date"
                        id="nascimento"
                        name="nascimento"
                        value="1990-03-15"
                        required
                    >

                </div>

                <br>

                <div>

                    <label for="telefone">
                        Telefone:
                    </label>

                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        value="(77) 99999-9999"
                        required
                    >

                </div>

            </section>


            <section>

                <h3>Endereço</h3>

                <div>

                    <label for="cep">
                        CEP:
                    </label>

                    <input
                        type="text"
                        id="cep"
                        name="cep"
                        value="47500-000"
                    >

                </div>

                <br>

                <div>

                    <label for="endereco">
                        Endereço:
                    </label>

                    <input
                        type="text"
                        id="endereco"
                        name="endereco"
                        value="Rua das Flores"
                    >

                </div>

                <br>

                <div>

                    <label for="numero">
                        Número:
                    </label>

                    <input
                        type="text"
                        id="numero"
                        name="numero"
                        value="120"
                    >

                </div>

                <br>

                <div>

                    <label for="cidade">
                        Cidade:
                    </label>

                    <input
                        type="text"
                        id="cidade"
                        name="cidade"
                        value="Paratinga"
                    >

                </div>

                <br>

                <div>

                    <label for="estado">
                        Estado:
                    </label>

                    <input
                        type="text"
                        id="estado"
                        name="estado"
                        value="BA"
                    >

                </div>

            </section>


            <section>

                <h3>Dados de Acesso</h3>

                <div>

                    <label for="email">
                        E-mail:
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="maria@email.com"
                        required
                    >

                </div>

                <br>

                <div>

                    <label for="senha">
                        Nova senha:
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite uma nova senha"
                    >

                </div>

                <br>

                <div>

                    <label for="confirmar-senha">
                        Confirmar nova senha:
                    </label>

                    <input
                        type="password"
                        id="confirmar-senha"
                        name="confirmar-senha"
                        placeholder="Confirme a nova senha"
                    >

                </div>

            </section>


            <section>

                <h3>Permissão de Acesso</h3>

                <p>
                    O gerente pode alterar o tipo de usuário.
                </p>

                <div>

                    <label for="tipo">
                        Tipo de Usuário:
                    </label>

                    <select
                        id="tipo"
                        name="tipo"
                        required
                    >

                        <option value="cliente" selected>
                            Cliente
                        </option>

                        <option value="funcionario">
                            Funcionário
                        </option>

                        <option value="gerente">
                            Gerente
                        </option>

                    </select>

                </div>

                <br>

                <div>

                    <label for="status">
                        Status:
                    </label>

                    <select
                        id="status"
                        name="status"
                    >

                        <option value="ativo" selected>
                            Ativo
                        </option>

                        <option value="inativo">
                            Inativo
                        </option>

                    </select>

                </div>

            </section>


            <section>

                <br>

                <button type="submit">
                    Salvar Alterações
                </button>

                <button type="reset">
                    Restaurar
                </button>

                <br><br>

                <a href="usuarios.html">
                    Cancelar
                </a>

            </section>

        </form>

    </main>


    <footer>

        <p>
            &copy; 2026 Hotel Pet
        </p>

    </footer>

</body>

</html>
