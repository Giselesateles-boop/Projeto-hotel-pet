<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet - Editar Usuário</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <div class="layout">

        <!-- MENU LATERAL -->
        <aside class="menu-lateral">

            <h1>Hotel Pet</h1>

            <nav>

                <a href="pets.html">
                    Pet
                </a>

                <a href="usuarios.html" class="menu-ativo">
                    Usuário
                </a>

                <a href="configuracoes.html">
                    Configurações
                </a>

                <a href="reservas.html">
                    Reservas
                </a>

            </nav>

        </aside>


        <!-- CONTEÚDO PRINCIPAL -->
        <div class="conteudo">

            <!-- TOPO -->
            <header class="topo">

                <div></div>

                <a href="perfil.html" class="perfil-topo">

                    <span class="icone-usuario">
                        O
                    </span>

                    <span>
                        Gisele Teles
                    </span>

                </a>

            </header>


            <!-- CONTEÚDO -->
            <main>

                <p class="breadcrumb">

                    <a href="dashboard.html">
                        Home
                    </a>

                    /

                    <a href="usuarios.html">
                        Usuários
                    </a>

                    /

                    Editar Usuário

                </p>


                <section class="card">

                    <h2>
                        Editar Usuário
                    </h2>


                    <form
                        action="usuarios.html"
                        method="get"
                    >

                        <!-- DADOS DO USUÁRIO -->
                        <section class="secao-formulario">

                            <h3>
                                Dados do Usuário
                            </h3>


                            <div class="formulario-duas-colunas">

                                <div class="campo-formulario">

                                    <label for="id">
                                        ID
                                    </label>

                                    <input
                                        type="text"
                                        id="id"
                                        name="id"
                                        value="001"
                                        readonly
                                    >

                                </div>


                                <div class="campo-formulario">

                                    <label for="nome">
                                        Nome *
                                    </label>

                                    <input
                                        type="text"
                                        id="nome"
                                        name="nome"
                                        value="Maria"
                                        required
                                    >

                                </div>


                                <div class="campo-formulario">

                                    <label for="sobrenome">
                                        Sobrenome
                                    </label>

                                    <input
                                        type="text"
                                        id="sobrenome"
                                        name="sobrenome"
                                        value="Silva"
                                    >

                                </div>


                                <div class="campo-formulario">

                                    <label for="email">
                                        E-mail *
                                    </label>

                                    <input
                                        type="email"
                                        id="email"
                                        name="email"
                                        value="maria@email.com"
                                        required
                                    >

                                </div>


                                <div class="campo-formulario">

                                    <label for="telefone">
                                        Telefone *
                                    </label>

                                    <input
                                        type="tel"
                                        id="telefone"
                                        name="telefone"
                                        value="(77) 99999-9999"
                                        required
                                    >

                                </div>

                            </div>

                        </section>


                        <!-- ENDEREÇO -->
                        <section class="secao-formulario">

                            <h3>
                                Endereço
                            </h3>


                            <div class="formulario-duas-colunas">

                                <div class="campo-formulario">

                                    <label for="cep">
                                        CEP
                                    </label>

                                    <input
                                        type="text"
                                        id="cep"
                                        name="cep"
                                        value="47500-000"
                                    >

                                </div>


                                <div class="campo-formulario">

                                    <label for="cidade">
                                        Cidade
                                    </label>

                                    <input
                                        type="text"
                                        id="cidade"
                                        name="cidade"
                                        value="Paratinga"
                                    >

                                </div>


                                <div class="campo-formulario">

                                    <label for="endereco">
                                        Endereço
                                    </label>

                                    <input
                                        type="text"
                                        id="endereco"
                                        name="endereco"
                                        value="Rua Principal"
                                    >

                                </div>


                                <div class="campo-formulario">

                                    <label for="numero">
                                        Número
                                    </label>

                                    <input
                                        type="text"
                                        id="numero"
                                        name="numero"
                                        value="100"
                                    >

                                </div>

                            </div>

                        </section>


                        <!-- ACESSO -->
                        <section class="secao-formulario">

                            <h3>
                                Acesso
                            </h3>


                            <div class="formulario-duas-colunas">

                                <div class="campo-formulario">

                                    <label for="funcao">
                                        Função *
                                    </label>

                                    <select
                                        id="funcao"
                                        name="funcao"
                                        required
                                    >

                                        <option value="cliente" selected>
                                            Cliente
                                        </option>

                                        <option value="funcionario">
                                            Funcionário
                                        </option>

                                        <option value="gerente">
                                            Gerente
                                        </option>

                                    </select>

                                </div>


                                <div class="campo-formulario">

                                    <label for="status">
                                        Status *
                                    </label>

                                    <select
                                        id="status"
                                        name="status"
                                        required
                                    >

                                        <option value="ativo" selected>
                                            Ativo
                                        </option>

                                        <option value="inativo">
                                            Inativo
                                        </option>

                                    </select>

                                </div>

                            </div>

                        </section>


                        <!-- FOTO -->
                        <section class="secao-formulario">

                            <h3>
                                Foto do Usuário
                            </h3>


                            <div class="campo-formulario">

                                <label for="foto">
                                    Alterar foto
                                </label>

                                <input
                                    type="file"
                                    id="foto"
                                    name="foto"
                                    accept="image/*"
                                >

                            </div>

                        </section>


                        <!-- BOTÕES -->
                        <div class="botoes-formulario">

                            <button
                                type="submit"
                                class="botao botao-salvar"
                            >
                                Salvar
                            </button>


                            <button
                                type="reset"
                                class="botao botao-limpar"
                            >
                                Limpar
                            </button>


                            <a
                                href="usuarios.html"
                                class="botao botao-cancelar"
                            >
                                Cancelar
                            </a>

                        </div>

                    </form>

                </section>

            </main>

        </div>

    </div>
    
  <script src="../js/navegacao.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const usuariosPadrao = {
        maria: {
            id: "001",
            nome: "Maria",
            sobrenome: "Silva",
            email: "maria@email.com",
            telefone: "(77) 99999-9999",
            cep: "47500-000",
            cidade: "Paratinga",
            endereco: "Rua Principal",
            numero: "100",
            funcao: "Cliente",
            status: "Ativo",
            foto: "../img/Maria.png",
            reservas: []
        },
        joao: {
            id: "002",
            nome: "João",
            sobrenome: "Santos",
            email: "joao@email.com",
            telefone: "(77) 98888-8888",
            cep: "",
            cidade: "",
            endereco: "",
            numero: "",
            funcao: "Cliente",
            status: "Ativo",
            foto: "../img/Joao.png",
            reservas: []
        },
        ana: {
            id: "003",
            nome: "Ana",
            sobrenome: "Oliveira",
            email: "ana@email.com",
            telefone: "(77) 97777-7777",
            cep: "",
            cidade: "",
            endereco: "",
            numero: "",
            funcao: "Funcionário",
            status: "Ativo",
            foto: "../img/Ana.png",
            reservas: []
        },
        gisele: {
            id: "004",
            nome: "Gisele",
            sobrenome: "Teles",
            email: "gisele@email.com",
            telefone: "(77) 96666-6666",
            cep: "",
            cidade: "",
            endereco: "",
            numero: "",
            funcao: "Gerente",
            status: "Ativo",
            foto: "../img/Gisele.png",
            reservas: []
        }
    };

    const chaveUsuarios = "hotelPetUsuarios";
    const parametros = new URLSearchParams(window.location.search);
    const identificador = parametros.get("usuario") || "maria";

    let usuariosSalvos = JSON.parse(
        localStorage.getItem(chaveUsuarios) || "{}"
    );

    if (Array.isArray(usuariosSalvos)) {
        usuariosSalvos = Object.fromEntries(
            usuariosSalvos.map(usuario => [String(usuario.id), usuario])
        );
    }

    // Localizar pela chave interna ou pelo ID numérico
    let chaveUsuario = identificador;

    if (!usuariosSalvos[chaveUsuario]) {
        const encontrado = Object.entries(usuariosSalvos).find(
            ([chave, usuario]) =>
                String(usuario.id) === String(identificador)
        );

        if (encontrado) {
            chaveUsuario = encontrado[0];
        }
    }

    let usuarioOriginal = null;

    if (usuariosSalvos[chaveUsuario]) {
        usuarioOriginal = {
            ...(usuariosPadrao[chaveUsuario] || {}),
            ...usuariosSalvos[chaveUsuario]
        };
    } else if (usuariosPadrao[identificador]) {
        chaveUsuario = identificador;
        usuarioOriginal = usuariosPadrao[identificador];
    }

    const formulario = document.querySelector("form");

    if (!usuarioOriginal) {

        formulario.hidden = true;

        document.querySelector("main").insertAdjacentHTML(
            "beforeend",
            "<p>Usuário não encontrado. Volte para a lista de usuários.</p>"
        );

        return;
    }

    // Preencher formulário
    document.getElementById("id").value = usuarioOriginal.id || "";
    document.getElementById("nome").value = usuarioOriginal.nome || "";
    document.getElementById("sobrenome").value = usuarioOriginal.sobrenome || "";
    document.getElementById("email").value = usuarioOriginal.email || "";
    document.getElementById("telefone").value = usuarioOriginal.telefone || "";
    document.getElementById("cep").value = usuarioOriginal.cep || "";
    document.getElementById("cidade").value = usuarioOriginal.cidade || "";
    document.getElementById("endereco").value = usuarioOriginal.endereco || "";
    document.getElementById("numero").value = usuarioOriginal.numero || "";

    document.getElementById("funcao").value =
        String(usuarioOriginal.funcao || "Cliente").toLowerCase();

    document.getElementById("status").value =
        String(usuarioOriginal.status || "Ativo").toLowerCase();

    // Compactar nova foto
    function compactarImagem(arquivo) {

        return new Promise(function (resolve, reject) {

            const leitor = new FileReader();

            leitor.onload = function () {

                const imagem = new Image();

                imagem.onload = function () {

                    const limite = 1200;

                    let largura = imagem.width;
                    let altura = imagem.height;

                    if (largura > limite || altura > limite) {

                        const proporcao = Math.min(
                            limite / largura,
                            limite / altura
                        );

                        largura = Math.round(largura * proporcao);
                        altura = Math.round(altura * proporcao);
                    }

                    const canvas = document.createElement("canvas");

                    canvas.width = largura;
                    canvas.height = altura;

                    const contexto = canvas.getContext("2d");

                    contexto.drawImage(
                        imagem,
                        0,
                        0,
                        largura,
                        altura
                    );

                    resolve(canvas.toDataURL("image/jpeg", 0.75));
                };

                imagem.onerror = function () {
                    reject(new Error("Não foi possível carregar a imagem."));
                };

                imagem.src = leitor.result;
            };

            leitor.onerror = function () {
                reject(new Error("Erro ao ler a imagem."));
            };

            leitor.readAsDataURL(arquivo);
        });
    }

    // Salvar alterações
    formulario.addEventListener("submit", async function (evento) {

        evento.preventDefault();

        const botaoSalvar = formulario.querySelector(
            'button[type="submit"]'
        );

        try {

            botaoSalvar.disabled = true;
            botaoSalvar.textContent = "Salvando...";

            const arquivoFoto = document.getElementById("foto").files[0];

            // Manter foto antiga se nenhuma nova for escolhida
            let foto = usuarioOriginal.foto || "";

            if (arquivoFoto) {

                if (!arquivoFoto.type.startsWith("image/")) {
                    throw new Error("Selecione uma imagem válida.");
                }

                foto = await compactarImagem(arquivoFoto);
            }

            const usuarioAtualizado = {

                ...usuarioOriginal,

                id: usuarioOriginal.id,

                nome: document.getElementById("nome").value.trim(),

                sobrenome: document.getElementById("sobrenome").value.trim(),

                email: document.getElementById("email").value.trim(),

                telefone: document.getElementById("telefone").value.trim(),

                cep: document.getElementById("cep").value.trim(),

                cidade: document.getElementById("cidade").value.trim(),

                endereco: document.getElementById("endereco").value.trim(),

                numero: document.getElementById("numero").value.trim(),

                funcao: document.getElementById("funcao").selectedOptions[0].textContent.trim(),

                status: document.getElementById("status").selectedOptions[0].textContent.trim(),

                foto: foto
            };

            if (
                !usuarioAtualizado.nome ||
                !usuarioAtualizado.email ||
                !usuarioAtualizado.telefone
            ) {
                alert("Preencha o nome, o e-mail e o telefone.");
                return;
            }

            // Atualizar mantendo a chave interna original
            usuariosSalvos[chaveUsuario] = usuarioAtualizado;

            localStorage.setItem(
                chaveUsuarios,
                JSON.stringify(usuariosSalvos)
            );

            alert("Usuário atualizado com sucesso!");

            window.location.href =
                "visualizar-usuario.html?usuario=" +
                encodeURIComponent(chaveUsuario);

        } catch (erro) {

            console.error("Erro ao editar usuário:", erro);

            alert(
                "Não foi possível salvar as alterações. " +
                "Verifique os dados e tente novamente."
            );

        } finally {

            botaoSalvar.disabled = false;
            botaoSalvar.textContent = "Salvar";

        }

    });

});
</script>

</body>
</html>

</body>

</html>
