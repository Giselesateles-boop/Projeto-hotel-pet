<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet - Cadastrar Usuário</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <div class="layout">

        <!-- MENU LATERAL -->
        <aside class="menu-lateral">

            <h1>
                Hotel Pet
            </h1>

            <nav>

                <a href="pets.html">
                    Pet
                </a>

                <a href="usuarios.html" class="menu-ativo">
                    Usuário
                </a>

                <a href="configuracoes.html">
                    Configurações
                </a>

                <a href="reservas.html">
                    Reservas
                </a>

            </nav>

        </aside>


        <!-- ÁREA PRINCIPAL -->
        <div class="conteudo">

            <!-- TOPO -->
            <header class="topo">

                <div></div>

                <a href="perfil.html" class="perfil-topo">

                    <span class="icone-usuario">
                        O
                    </span>

                    <span>
                        Gisele Teles
                    </span>

                </a>

            </header>


            <!-- CONTEÚDO -->
            <main>

                <!-- BREADCRUMB -->
                <p class="breadcrumb">

                    <a href="dashboard.html">
                        Home
                    </a>

                    /

                    <a href="usuarios.html">
                        Usuários
                    </a>

                    /

                    Cadastrar Usuário

                </p>


                <!-- CARD -->
                <section class="card">

                    <h2>
                        Cadastrar Usuário
                    </h2>


                    <form
                        action="usuarios.html"
                        method="get"
                    >

                        <!-- DADOS DO USUÁRIO -->
                        <section class="secao-formulario">

                            <h3>
                                Dados do Usuário
                            </h3>


                            <div class="formulario-duas-colunas">

                                <div class="campo-formulario">

                                    <label for="nome">
                                        Nome *
                                    </label>

                                    <input
                                        type="text"
                                        id="nome"
                                        name="nome"
                                        placeholder="Digite o nome"
                                        required
                                    >

                                </div>


                                <div class="campo-formulario">

                                    <label for="sobrenome">
                                        Sobrenome
                                    </label>

                                    <input
                                        type="text"
                                        id="sobrenome"
                                        name="sobrenome"
                                        placeholder="Digite o sobrenome"
                                    >

                                </div>


                                <div class="campo-formulario">

                                    <label for="email">
                                        E-mail *
                                    </label>

                                    <input
                                        type="email"
                                        id="email"
                                        name="email"
                                        placeholder="Digite o e-mail"
                                        required
                                    >

                                </div>


                                <div class="campo-formulario">

                                    <label for="telefone">
                                        Telefone *
                                    </label>

                                    <input
                                        type="tel"
                                        id="telefone"
                                        name="telefone"
                                        placeholder="(00) 00000-0000"
                                        required
                                    >

                                </div>

                            </div>

                        </section>


                        <!-- ENDEREÇO -->
                        <section class="secao-formulario">

                            <h3>
                                Endereço
                            </h3>


                            <div class="formulario-duas-colunas">

                                <div class="campo-formulario">

                                    <label for="cep">
                                        CEP
                                    </label>

                                    <input
                                        type="text"
                                        id="cep"
                                        name="cep"
                                        placeholder="00000-000"
                                    >

                                </div>


                                <div class="campo-formulario">

                                    <label for="cidade">
                                        Cidade
                                    </label>

                                    <input
                                        type="text"
                                        id="cidade"
                                        name="cidade"
                                        placeholder="Digite a cidade"
                                    >

                                </div>


                                <div class="campo-formulario">

                                    <label for="endereco">
                                        Endereço
                                    </label>

                                    <input
                                        type="text"
                                        id="endereco"
                                        name="endereco"
                                        placeholder="Digite o endereço"
                                    >

                                </div>


                                <div class="campo-formulario">

                                    <label for="numero">
                                        Número
                                    </label>

                                    <input
                                        type="text"
                                        id="numero"
                                        name="numero"
                                        placeholder="Número"
                                    >

                                </div>

                            </div>

                        </section>


                        <!-- ACESSO -->
                        <section class="secao-formulario">

                            <h3>
                                Acesso
                            </h3>


                            <div class="formulario-duas-colunas">

                                <div class="campo-formulario">

                                    <label for="senha">
                                        Senha *
                                    </label>

                                    <input
                                        type="password"
                                        id="senha"
                                        name="senha"
                                        placeholder="Digite a senha"
                                        required
                                    >

                                </div>


                                <div class="campo-formulario">

                                    <label for="confirmar-senha">
                                        Confirmar senha *
                                    </label>

                                    <input
                                        type="password"
                                        id="confirmar-senha"
                                        name="confirmar-senha"
                                        placeholder="Confirme a senha"
                                        required
                                    >

                                </div>


                                <div class="campo-formulario">

                                    <label for="funcao">
                                        Função *
                                    </label>

                                    <select
                                        id="funcao"
                                        name="funcao"
                                        required
                                    >

                                        <option value="">
                                            Selecione
                                        </option>

                                        <option value="cliente">
                                            Cliente
                                        </option>

                                        <option value="funcionario">
                                            Funcionário
                                        </option>

                                        <option value="gerente">
                                            Gerente
                                        </option>

                                    </select>

                                </div>


                                <div class="campo-formulario">

                                    <label for="status">
                                        Status
                                    </label>

                                    <select
                                        id="status"
                                        name="status"
                                    >

                                        <option value="ativo" selected>
                                            Ativo
                                        </option>

                                        <option value="inativo">
                                            Inativo
                                        </option>

                                    </select>

                                </div>

                            </div>

                        </section>


                        <!-- FOTO -->
                        <section class="secao-formulario">

                            <h3>
                                Foto do Usuário
                            </h3>


                            <div class="campo-formulario">

                                <label for="foto">
                                    Foto
                                </label>

                                <input
                                    type="file"
                                    id="foto"
                                    name="foto"
                                    accept="image/*"
                                >

                            </div>

                        </section>


                        <!-- BOTÕES -->
                        <div class="botoes-formulario">

                            <button
                                type="submit"
                                class="botao botao-salvar"
                            >
                                Salvar
                            </button>


                            <button
                                type="reset"
                                class="botao botao-limpar"
                            >
                                Limpar
                            </button>


                            <a
                                href="usuarios.html"
                                class="botao botao-cancelar"
                            >
                                Cancelar
                            </a>

                        </div>

                    </form>

                </section>

            </main>

        </div>

    </div>
<script src="../js/navegacao.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const formulario = document.querySelector("form");

    formulario.addEventListener("submit", async function (evento) {

        evento.preventDefault();

        const botaoSalvar = formulario.querySelector(
            'button[type="submit"]'
        );

        const senha = document.getElementById("senha").value;
        const confirmarSenha = document.getElementById("confirmar-senha").value;

        if (senha !== confirmarSenha) {
            alert("As senhas não coincidem!");
            return;
        }

        try {

            botaoSalvar.disabled = true;
            botaoSalvar.textContent = "Salvando...";

            const email = document.getElementById("email").value
                .trim()
                .toLowerCase();

            // Recuperar usuários cadastrados
            const dadosSalvos = JSON.parse(
                localStorage.getItem("hotelPetUsuarios") || "{}"
            );

            // Manter o formato de objeto utilizado pela listagem
            const usuarios = Array.isArray(dadosSalvos)
                ? Object.fromEntries(
                    dadosSalvos.map(usuario => [
                        String(usuario.id),
                        usuario
                    ])
                )
                : dadosSalvos;

            // Verificar e-mail duplicado
            const emailExiste = Object.values(usuarios).some(function (usuario) {
                return String(usuario.email || "").toLowerCase() === email;
            });

            if (emailExiste) {
                alert("Já existe um usuário cadastrado com esse e-mail.");
                return;
            }

            // CORRIGIR E ORGANIZAR OS IDs
            let maiorId = 0;

            // Encontrar o maior ID numérico existente
            Object.entries(usuarios).forEach(function ([chave, usuario]) {

                const idAtual = String(usuario.id || chave);

                if (/^\d+$/.test(idAtual)) {

                    const numero = Number(idAtual);

                    if (numero > maiorId) {
                        maiorId = numero;
                    }
                }

            });

            // Corrigir IDs que não seguem o padrão 001, 002, 003...
            Object.entries(usuarios).forEach(function ([chave, usuario]) {

                const idAtual = String(usuario.id || chave);

                if (!/^\d{3}$/.test(idAtual)) {

                    maiorId++;

                    const novoId = String(maiorId).padStart(3, "0");

                    delete usuarios[chave];

                    usuario.id = novoId;

                    usuarios[novoId] = usuario;
                }

            });

            // Compactar foto
            async function compactarImagem(arquivo) {

                return new Promise(function (resolve, reject) {

                    const leitor = new FileReader();

                    leitor.onload = function () {

                        const imagem = new Image();

                        imagem.onload = function () {

                            const limite = 1200;

                            let largura = imagem.width;
                            let altura = imagem.height;

                            if (largura > limite || altura > limite) {

                                const proporcao = Math.min(
                                    limite / largura,
                                    limite / altura
                                );

                                largura = Math.round(largura * proporcao);
                                altura = Math.round(altura * proporcao);
                            }

                            const canvas = document.createElement("canvas");

                            canvas.width = largura;
                            canvas.height = altura;

                            const contexto = canvas.getContext("2d");

                            contexto.drawImage(
                                imagem,
                                0,
                                0,
                                largura,
                                altura
                            );

                            resolve(
                                canvas.toDataURL("image/jpeg", 0.75)
                            );
                        };

                        imagem.onerror = function () {
                            reject(new Error("Erro ao carregar a foto."));
                        };

                        imagem.src = leitor.result;
                    };

                    leitor.onerror = function () {
                        reject(new Error("Erro ao ler a foto."));
                    };

                    leitor.readAsDataURL(arquivo);
                });
            }

            const arquivoFoto = document.getElementById("foto").files[0];

            let foto = "";

            if (arquivoFoto) {

                if (!arquivoFoto.type.startsWith("image/")) {
                    throw new Error("Selecione uma imagem válida.");
                }

                foto = await compactarImagem(arquivoFoto);
            }

            // GERAR PRÓXIMO ID NUMÉRICO
            maiorId++;

            const id = String(maiorId).padStart(3, "0");

            const novoUsuario = {

                id: id,

                nome: document.getElementById("nome").value.trim(),

                sobrenome: document.getElementById("sobrenome").value.trim(),

                email: email,

                telefone: document.getElementById("telefone").value.trim(),

                cep: document.getElementById("cep").value.trim(),

                cidade: document.getElementById("cidade").value.trim(),

                endereco: document.getElementById("endereco").value.trim(),

                numero: document.getElementById("numero").value.trim(),

                senha: senha,

                funcao: document.getElementById("funcao").value,

                status: document.getElementById("status").value,

                foto: foto
            };

            // Salvar o novo usuário
            usuarios[id] = novoUsuario;

            localStorage.setItem(
                "hotelPetUsuarios",
                JSON.stringify(usuarios)
            );

            alert("Usuário cadastrado com sucesso! ID: " + id);

            window.location.href = "usuarios.html";

        } catch (erro) {

            console.error("Erro ao cadastrar usuário:", erro);

            alert(
                "Não foi possível salvar o usuário. " +
                "Verifique os dados ou tente utilizar uma foto menor."
            );

        } finally {

            botaoSalvar.disabled = false;
            botaoSalvar.textContent = "Salvar";

        }

    });

});
</script>

</body>

</html>
