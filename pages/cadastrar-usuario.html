<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet - Cadastrar Usuário</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <div class="layout">

        <!-- MENU LATERAL -->
        <aside class="menu-lateral">

            <h1>
                Hotel Pet
            </h1>

            <nav>

                <a href="pets.html">
                    Pet
                </a>

                <a href="usuarios.html" class="menu-ativo">
                    Usuário
                </a>

                <a href="configuracoes.html">
                    Configurações
                </a>

                <a href="reservas.html">
                    Reservas
                </a>

            </nav>

        </aside>


        <!-- ÁREA PRINCIPAL -->
        <div class="conteudo">

            <!-- TOPO -->
            <header class="topo">

                <div></div>

                <a href="perfil.html" class="perfil-topo">

                    <span class="icone-usuario">
                        O
                    </span>

                    <span>
                        Gisele Teles
                    </span>

                </a>

            </header>


            <!-- CONTEÚDO -->
            <main>

                <!-- BREADCRUMB -->
                <p class="breadcrumb">

                    <a href="dashboard.html">
                        Home
                    </a>

                    /

                    <a href="usuarios.html">
                        Usuários
                    </a>

                    /

                    Cadastrar Usuário

                </p>


                <!-- CARD -->
                <section class="card">

                    <h2>
                        Cadastrar Usuário
                    </h2>


                    <form
                        action="usuarios.html"
                        method="get"
                    >

                        <!-- DADOS DO USUÁRIO -->
                        <section class="secao-formulario">

                            <h3>
                                Dados do Usuário
                            </h3>


                            <div class="formulario-duas-colunas">

                                <div class="campo-formulario">

                                    <label for="nome">
                                        Nome *
                                    </label>

                                    <input
                                        type="text"
                                        id="nome"
                                        name="nome"
                                        placeholder="Digite o nome"
                                        required
                                    >

                                </div>


                                <div class="campo-formulario">

                                    <label for="sobrenome">
                                        Sobrenome
                                    </label>

                                    <input
                                        type="text"
                                        id="sobrenome"
                                        name="sobrenome"
                                        placeholder="Digite o sobrenome"
                                    >

                                </div>


                                <div class="campo-formulario">

                                    <label for="email">
                                        E-mail *
                                    </label>

                                    <input
                                        type="email"
                                        id="email"
                                        name="email"
                                        placeholder="Digite o e-mail"
                                        required
                                    >

                                </div>


                                <div class="campo-formulario">

                                    <label for="telefone">
                                        Telefone *
                                    </label>

                                    <input
                                        type="tel"
                                        id="telefone"
                                        name="telefone"
                                        placeholder="(00) 00000-0000"
                                        required
                                    >

                                </div>

                            </div>

                        </section>


                        <!-- ENDEREÇO -->
                        <section class="secao-formulario">

                            <h3>
                                Endereço
                            </h3>


                            <div class="formulario-duas-colunas">

                                <div class="campo-formulario">

                                    <label for="cep">
                                        CEP
                                    </label>

                                    <input
                                        type="text"
                                        id="cep"
                                        name="cep"
                                        placeholder="00000-000"
                                    >

                                </div>


                                <div class="campo-formulario">

                                    <label for="cidade">
                                        Cidade
                                    </label>

                                    <input
                                        type="text"
                                        id="cidade"
                                        name="cidade"
                                        placeholder="Digite a cidade"
                                    >

                                </div>


                                <div class="campo-formulario">

                                    <label for="endereco">
                                        Endereço
                                    </label>

                                    <input
                                        type="text"
                                        id="endereco"
                                        name="endereco"
                                        placeholder="Digite o endereço"
                                    >

                                </div>


                                <div class="campo-formulario">

                                    <label for="numero">
                                        Número
                                    </label>

                                    <input
                                        type="text"
                                        id="numero"
                                        name="numero"
                                        placeholder="Número"
                                    >

                                </div>

                            </div>

                        </section>


                        <!-- ACESSO -->
                        <section class="secao-formulario">

                            <h3>
                                Acesso
                            </h3>


                            <div class="formulario-duas-colunas">

                                <div class="campo-formulario">

                                    <label for="senha">
                                        Senha *
                                    </label>

                                    <input
                                        type="password"
                                        id="senha"
                                        name="senha"
                                        placeholder="Digite a senha"
                                        required
                                    >

                                </div>


                                <div class="campo-formulario">

                                    <label for="confirmar-senha">
                                        Confirmar senha *
                                    </label>

                                    <input
                                        type="password"
                                        id="confirmar-senha"
                                        name="confirmar-senha"
                                        placeholder="Confirme a senha"
                                        required
                                    >

                                </div>


                                <div class="campo-formulario">

                                    <label for="funcao">
                                        Função *
                                    </label>

                                    <select
                                        id="funcao"
                                        name="funcao"
                                        required
                                    >

                                        <option value="">
                                            Selecione
                                        </option>

                                        <option value="cliente">
                                            Cliente
                                        </option>

                                        <option value="funcionario">
                                            Funcionário
                                        </option>

                                        <option value="gerente">
                                            Gerente
                                        </option>

                                    </select>

                                </div>


                                <div class="campo-formulario">

                                    <label for="status">
                                        Status
                                    </label>

                                    <select
                                        id="status"
                                        name="status"
                                    >

                                        <option value="ativo" selected>
                                            Ativo
                                        </option>

                                        <option value="inativo">
                                            Inativo
                                        </option>

                                    </select>

                                </div>

                            </div>

                        </section>


                        <!-- FOTO -->
                        <section class="secao-formulario">

                            <h3>
                                Foto do Usuário
                            </h3>


                            <div class="campo-formulario">

                                <label for="foto">
                                    Foto
                                </label>

                                <input
                                    type="file"
                                    id="foto"
                                    name="foto"
                                    accept="image/*"
                                >

                            </div>

                        </section>


                        <!-- BOTÕES -->
                        <div class="botoes-formulario">

                            <button
                                type="submit"
                                class="botao botao-salvar"
                            >
                                Salvar
                            </button>


                            <button
                                type="reset"
                                class="botao botao-limpar"
                            >
                                Limpar
                            </button>


                            <a
                                href="usuarios.html"
                                class="botao botao-cancelar"
                            >
                                Cancelar
                            </a>

                        </div>

                    </form>

                </section>

            </main>

        </div>

    </div>

</body>

</html>
