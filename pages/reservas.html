
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Reservas</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="layout">

        <aside class="menu-lateral">
            <h1>Hotel Pet</h1>

            <nav>
                <a href="pets.html">Pet</a>
                <a href="usuarios.html">Usuário</a>
                <a href="configuracoes.html">Configurações</a>
                <a href="reservas.html" class="menu-ativo">Reservas</a>
            </nav>
        </aside>

        <div class="conteudo">

            <header class="topo">
                <div></div>

                <a href="perfil.html" class="perfil-topo">
                    <span class="icone-usuario">O</span>
                    <span>Gisele Teles</span>
                </a>
            </header>

            <main>

                <p class="breadcrumb">
                    <a href="dashboard.html">Home</a>
                    / Reservas
                </p>

                <section class="card">

                    <div class="cabecalho-pagina">

                        <h2>Reservas</h2>

                        <a href="cadastrar-reserva.html"
                            class="botao botao-salvar">
                            + Nova reserva
                        </a>

                    </div>

                    <!-- PESQUISA -->
                    <section class="filtros">

                        <h3>Pesquisar</h3>

                        <form class="formulario-pesquisa"
                            id="formulario-pesquisa">

                            <div class="campo-formulario">
                                <label for="pet">Pet</label>
                                <input type="text" id="pet"
                                    placeholder="Nome do pet">
                            </div>

                            <div class="campo-formulario">
                                <label for="proprietario">Proprietário</label>
                                <input type="text" id="proprietario"
                                    placeholder="Nome do proprietário">
                            </div>

                            <div class="campo-formulario">
                                <label for="status">Status</label>

                                <select id="status">
                                    <option value="todos">Todos</option>
                                    <option value="agendada">Agendada</option>
                                    <option value="confirmada">Confirmada</option>
                                    <option value="andamento">Em andamento</option>
                                    <option value="finalizada">Finalizada</option>
                                </select>
                            </div>

                            <button type="submit"
                                class="botao botao-pesquisar">
                                Pesquisar
                            </button>

                        </form>

                    </section>

                    <!-- AÇÕES -->
                    <section class="card">

                        <div class="acoes-usuarios">

                            <button type="button"
                                class="botao botao-remover"
                                id="remover-reservas">
                                Remover
                            </button>

                            <button type="button"
                                class="botao botao-status"
                                id="mudar-status-reservas">
                                Mudar status
                            </button>

                            <button type="button"
                                class="botao botao-visualizacao-ativo"
                                id="visualizar-reservas">
                                Reservas
                            </button>

                            <button type="button"
                                class="botao"
                                id="visualizar-status">
                                Status
                            </button>

                        </div>

                    </section>

                    <!-- TABELA -->
                    <section class="tabela-container">

                        <table class="tabela">

                            <thead>
                                <tr>
                                    <th>Selecionar</th>
                                    <th>ID</th>
                                    <th>Pet</th>
                                    <th>Proprietário</th>
                                    <th>Entrada</th>
                                    <th>Saída</th>
                                    <th>Status</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>

                            <tbody id="tabela-reservas">
                            </tbody>

                        </table>

                        <p id="mensagem-reservas" role="status"></p>

                    </section>

                </section>

            </main>

        </div>

    </div>

    <script src="../js/navegacao.js"></script>

    <script>

    document.addEventListener("DOMContentLoaded", function () {

        const tabela = document.getElementById("tabela-reservas");

        const formulario = document.getElementById("formulario-pesquisa");

        const mensagem = document.getElementById("mensagem-reservas");

        const botaoRemover = document.getElementById("remover-reservas");

        const botaoStatus = document.getElementById("mudar-status-reservas");

        const botaoReservas = document.getElementById("visualizar-reservas");

        const botaoVisualizarStatus = document.getElementById("visualizar-status");

        const chaveReservas = "hotelPetReservas";
        const chaveRemovidas = "hotelPetReservasRemovidas";
        const chaveStatus = "hotelPetStatusReservas";

        const ordemStatus = [
            "Agendada",
            "Confirmada",
            "Em andamento",
            "Finalizada"
        ];

        // RESERVAS PADRÃO
        const reservasPadrao = [

            {
                id: "001",
                pet: "Thor",
                proprietario: "Maria Silva",
                entrada: "20/08/2026",
                saida: "25/08/2026",
                status: "Confirmada"
            },

            {
                id: "002",
                pet: "Luna",
                proprietario: "João Santos",
                entrada: "21/08/2026",
                saida: "24/08/2026",
                status: "Em andamento"
            },

            {
                id: "003",
                pet: "Mel",
                proprietario: "Ana Oliveira",
                entrada: "15/08/2026",
                saida: "18/08/2026",
                status: "Finalizada"
            },

            {
                id: "004",
                pet: "Bob",
                proprietario: "Gisele Teles",
                entrada: "25/08/2026",
                saida: "30/08/2026",
                status: "Agendada"
            }

        ];

        // RECUPERAR DADOS DO NAVEGADOR
        let reservasSalvas = JSON.parse(
            localStorage.getItem(chaveReservas) || "[]"
        );

        let reservasRemovidas = JSON.parse(
            localStorage.getItem(chaveRemovidas) || "[]"
        );

        let statusSalvos = JSON.parse(
            localStorage.getItem(chaveStatus) || "{}"
        );

        // JUNTAR RESERVAS PADRÃO E NOVAS
        let todasReservas = [
            ...reservasPadrao,
            ...reservasSalvas
        ];

        let visualizarPorStatus = false;

        // NORMALIZAR TEXTO
        function normalizar(texto) {
            return String(texto || "").trim().toLowerCase();
        }

        // FORMATAR DATA PARA DD/MM/AAAA
        function formatarData(data) {

            if (!data) return "";

            const valor = String(data).trim();

            // Verifica se está no formato AAAA-MM-DD
            const formatoISO = valor.match(
                /^(\d{4})-(\d{2})-(\d{2})$/
            );

            if (formatoISO) {

                return formatoISO[3] + "/" +
                    formatoISO[2] + "/" +
                    formatoISO[1];

            }

            // Se já estiver no formato DD/MM/AAAA,
            // mantém a data original.
            const formatoBR = valor.match(
                /^(\d{2})\/(\d{2})\/(\d{4})$/
            );

            if (formatoBR) {
                return valor;
            }

            return valor;
        }

        // RECUPERAR STATUS ATUAL
        function obterStatus(reserva) {

            return statusSalvos[reserva.id] || reserva.status;

        }

        // FILTRAR E EXIBIR RESERVAS
        function carregarReservas() {

            const petPesquisa = normalizar(
                document.getElementById("pet").value
            );

            const proprietarioPesquisa = normalizar(
                document.getElementById("proprietario").value
            );

            const statusPesquisa = document.getElementById("status").value;

            let reservasExibidas = todasReservas.filter(function (reserva) {

                if (reservasRemovidas.includes(reserva.id)) {
                    return false;
                }

                const nomePet = normalizar(reserva.pet);

                const nomeProprietario = normalizar(
                    reserva.proprietario || reserva.tutor
                );

                const statusAtual = obterStatus(reserva);

                const correspondePet = nomePet.includes(petPesquisa);

                const correspondeProprietario =
                    nomeProprietario.includes(proprietarioPesquisa);

                let correspondeStatus = true;

                if (statusPesquisa !== "todos") {

                    const statusNormalizado = normalizar(statusAtual);

                    const statusFiltro = statusPesquisa === "andamento"
                        ? "em andamento"
                        : statusPesquisa;

                    correspondeStatus =
                        statusNormalizado === statusFiltro;

                }

                return correspondePet &&
                    correspondeProprietario &&
                    correspondeStatus;

            });

            // ORGANIZAR POR STATUS
            if (visualizarPorStatus) {

                reservasExibidas.sort(function (a, b) {

                    return ordemStatus.indexOf(obterStatus(a)) -
                        ordemStatus.indexOf(obterStatus(b));

                });

            }

            tabela.innerHTML = "";

            reservasExibidas.forEach(function (reserva) {

                const linha = document.createElement("tr");

                linha.dataset.id = reserva.id;

                linha.innerHTML = `
                    <td>
                        <input type="checkbox"
                            class="selecionar-reserva">
                    </td>

                    <td>${reserva.id}</td>

                    <td>${reserva.pet}</td>

                    <td>${reserva.proprietario || reserva.tutor || ""}</td>

                    <td>${formatarData(reserva.entrada)}</td>

                    <td>${formatarData(reserva.saida)}</td>

                    <td class="status-reserva">
                        ${obterStatus(reserva)}
                    </td>

                    <td>
                        <a href="visualizar-reserva.html?reserva=${encodeURIComponent(reserva.id)}">
                            Visualizar
                        </a>

                        &nbsp;

                        <a href="editar-reserva.html?reserva=${encodeURIComponent(reserva.id)}">
                            Editar
                        </a>
                    </td>
                `;

                tabela.appendChild(linha);

            });

            mensagem.textContent = reservasExibidas.length === 0
                ? "Nenhuma reserva encontrada."
                : reservasExibidas.length +
                    (reservasExibidas.length === 1
                        ? " reserva encontrada."
                        : " reservas encontradas.");

        }

        // PESQUISAR
        formulario.addEventListener("submit", function (evento) {

            evento.preventDefault();

            carregarReservas();

        });

        // REMOVER RESERVAS
        botaoRemover.addEventListener("click", function () {

            const selecionadas = Array.from(
                tabela.querySelectorAll(".selecionar-reserva:checked")
            );

            if (selecionadas.length === 0) {

                alert("Selecione pelo menos uma reserva para remover.");
                return;

            }

            if (!confirm("Deseja realmente remover as reservas selecionadas?")) {
                return;
            }

            selecionadas.forEach(function (checkbox) {

                const id = checkbox.closest("tr").dataset.id;

                if (!reservasRemovidas.includes(id)) {
                    reservasRemovidas.push(id);
                }

            });

            localStorage.setItem(
                chaveRemovidas,
                JSON.stringify(reservasRemovidas)
            );

            carregarReservas();

            mensagem.textContent = "Reserva(s) removida(s) com sucesso.";

        });

        // MUDAR STATUS
        botaoStatus.addEventListener("click", function () {

            const selecionadas = Array.from(
                tabela.querySelectorAll(".selecionar-reserva:checked")
            );

            if (selecionadas.length === 0) {

                alert("Selecione pelo menos uma reserva para mudar o status.");
                return;

            }

            selecionadas.forEach(function (checkbox) {

                const id = checkbox.closest("tr").dataset.id;

                const reserva = todasReservas.find(function (item) {
                    return item.id === id;
                });

                if (!reserva) return;

                const statusAtual = obterStatus(reserva);

                let indice = ordemStatus.indexOf(statusAtual);

                indice = (indice + 1) % ordemStatus.length;

                statusSalvos[id] = ordemStatus[indice];

            });

            localStorage.setItem(
                chaveStatus,
                JSON.stringify(statusSalvos)
            );

            carregarReservas();

            mensagem.textContent = "Status atualizado com sucesso.";

        });

        // VISUALIZAR TODAS AS RESERVAS
        botaoReservas.addEventListener("click", function () {

            visualizarPorStatus = false;

            carregarReservas();

            mensagem.textContent = "Exibindo todas as reservas.";

        });

        // VISUALIZAR POR STATUS
        botaoVisualizarStatus.addEventListener("click", function () {

            visualizarPorStatus = true;

            carregarReservas();

            mensagem.textContent = "Reservas organizadas por status.";

        });

        // EXIBIR INICIALMENTE
        carregarReservas();

    });

    </script>

</body>
</html>
