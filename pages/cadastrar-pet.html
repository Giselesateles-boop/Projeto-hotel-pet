<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet - Cadastrar Pet</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <div class="layout">

        <!-- MENU LATERAL -->
        <aside class="menu-lateral">

            <h1>Hotel Pet</h1>

            <nav>

                <a href="pets.html" class="menu-ativo">
                    Pet
                </a>

                <a href="usuarios.html">
                    Usuário
                </a>

                <a href="configuracoes.html">
                    Configurações
                </a>

                <a href="reservas.html">
                    Reservas
                </a>

            </nav>

        </aside>


        <!-- ÁREA PRINCIPAL -->
        <div class="conteudo">

            <!-- TOPO -->
            <header class="topo">

                <div></div>

                <a href="perfil.html" class="perfil-topo">

                    <span class="icone-usuario">
                        O
                    </span>

                    <span>
                        Gisele Teles
                    </span>

                </a>

            </header>


            <!-- CONTEÚDO -->
            <main>

                <!-- BREADCRUMB -->
                <p class="breadcrumb">

                    <a href="dashboard.html">
                        Home
                    </a>

                    /

                    <a href="pets.html">
                        Pets
                    </a>

                    / Cadastrar Pet

                </p>


                <!-- CARD -->
                <section class="card">

                    <h2>
                        Cadastrar Pet
                    </h2>


                    <form
                        action="pets.html"
                        method="get"
                    >

                        <!-- DADOS DO PET -->
                        <section class="secao-formulario">

                            <h3>
                                Dados do Pet
                            </h3>


                            <div class="formulario-duas-colunas">

                                <!-- NOME -->
                                <div class="campo-formulario">

                                    <label for="nome-pet">
                                        Nome do pet *
                                    </label>

                                    <input
                                        type="text"
                                        id="nome-pet"
                                        name="nome-pet"
                                        placeholder="Digite o nome do pet"
                                        required
                                    >

                                </div>


                                <!-- TIPO -->
                                <div class="campo-formulario">

                                    <label for="tipo">
                                        Tipo *
                                    </label>

                                    <select
                                        id="tipo"
                                        name="tipo"
                                        required
                                    >

                                        <option value="">
                                            Selecione
                                        </option>

                                        <option value="cachorro">
                                            Cachorro
                                        </option>

                                        <option value="gato">
                                            Gato
                                        </option>

                                        <option value="outro">
                                            Outro
                                        </option>

                                    </select>

                                </div>


                                <!-- RAÇA -->
                                <div class="campo-formulario">

                                    <label for="raca">
                                        Raça
                                    </label>

                                    <input
                                        type="text"
                                        id="raca"
                                        name="raca"
                                        placeholder="Digite a raça"
                                    >

                                </div>


                                <!-- PORTE -->
                                <div class="campo-formulario">

                                    <label for="porte">
                                        Porte *
                                    </label>

                                    <select
                                        id="porte"
                                        name="porte"
                                        required
                                    >

                                        <option value="">
                                            Selecione
                                        </option>

                                        <option value="pequeno">
                                            Pequeno
                                        </option>

                                        <option value="medio">
                                            Médio
                                        </option>

                                        <option value="grande">
                                            Grande
                                        </option>

                                    </select>

                                </div>


                                <!-- IDADE -->
                                <div class="campo-formulario">

                                    <label for="idade">
                                        Idade
                                    </label>

                                    <input
                                        type="number"
                                        id="idade"
                                        name="idade"
                                        placeholder="Idade em anos"
                                        min="0"
                                    >

                                </div>


                                <!-- PESO -->
                                <div class="campo-formulario">

                                    <label for="peso">
                                        Peso
                                    </label>

                                    <input
                                        type="text"
                                        id="peso"
                                        name="peso"
                                        placeholder="Ex.: 12 kg"
                                    >

                                </div>

                            </div>

                        </section>


                        <!-- PROPRIETÁRIO -->
                        <section class="secao-formulario">

                            <h3>
                                Proprietário
                            </h3>


                            <div class="formulario-duas-colunas">

                                <div class="campo-formulario">

                                    <label for="proprietario">
                                        Proprietário *
                                    </label>

                                    <select
                                        id="proprietario"
                                        name="proprietario"
                                        required
                                    >

                                        <option value="">
                                            Selecione
                                        </option>

                                        <option value="maria">
                                            Maria Silva
                                        </option>

                                        <option value="joao">
                                            João Santos
                                        </option>

                                        <option value="ana">
                                            Ana Oliveira
                                        </option>

                                        <option value="gisele">
                                            Gisele Teles
                                        </option>

                                    </select>

                                </div>

                            </div>

                        </section>


                        <!-- CUIDADOS -->
                        <section class="secao-formulario">

                            <h3>
                                Cuidados
                            </h3>


                            <div class="formulario-duas-colunas">

                                <!-- ALIMENTAÇÃO -->
                                <div class="campo-formulario campo-completo">

                                    <label for="alimentacao">
                                        Alimentação
                                    </label>

                                    <textarea
                                        id="alimentacao"
                                        name="alimentacao"
                                        rows="4"
                                        placeholder="Informe os cuidados com a alimentação"
                                    ></textarea>

                                </div>


                                <!-- OBSERVAÇÕES -->
                                <div class="campo-formulario campo-completo">

                                    <label for="observacoes">
                                        Observações
                                    </label>

                                    <textarea
                                        id="observacoes"
                                        name="observacoes"
                                        rows="4"
                                        placeholder="Informe outras observações importantes"
                                    ></textarea>

                                </div>

                            </div>

                        </section>


                        <!-- FOTO -->
                        <section class="secao-formulario">

                            <h3>
                                Foto do Pet
                            </h3>


                            <div class="campo-formulario">

                                <label for="foto">
                                    Foto
                                </label>

                                <input
                                    type="file"
                                    id="foto"
                                    name="foto"
                                    accept="image/*"
                                >

                            </div>

                        </section>


                        <!-- BOTÕES -->
                        <div class="botoes-formulario">

                            <button
                                type="submit"
                                class="botao botao-salvar"
                            >
                                Salvar
                            </button>


                            <button
                                type="reset"
                                class="botao botao-limpar"
                            >
                                Limpar
                            </button>


                            <a
                                href="pets.html"
                                class="botao botao-cancelar"
                            >
                                Cancelar
                            </a>

                        </div>

                    </form>

                </section>

            </main>

        </div>

    </div>

</body>

</html>
