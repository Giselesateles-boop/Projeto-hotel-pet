<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet - Cadastrar Pet</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="layout">

        <!-- MENU LATERAL -->
        <aside class="menu-lateral">

            <h1>Hotel Pet</h1>

            <nav>

                <a href="pets.html" class="menu-ativo">
                    🐾 Pet
                </a>

                <a href="usuarios.html">
                    ♙ Usuário
                </a>

                <a href="configuracoes.html">
                    ⚙ Configurações
                </a>

                <a href="reservas.html">
                    ▣ Reservas
                </a>

            </nav>

        </aside>


        <!-- ÁREA PRINCIPAL -->
        <div class="conteudo">

            <!-- TOPO -->
            <header class="topo">

                <div></div>

                <div class="perfil-topo">

                    <span class="icone-usuario">◯</span>

                    <span>João da Silva</span>

                </div>

            </header>


            <!-- CONTEÚDO -->
            <main>

                <p class="breadcrumb">
                    Home / Pets / Cadastrar Pet
                </p>


                <section class="card formulario-card">

                    <h2>Cadastrar Pet</h2>


                    <form>


                        <!-- DADOS DO PET -->
                        <div class="grupo-formulario">

                            <h3>Dados do Pet</h3>


                            <div class="linha-formulario">

                                <div class="campo-formulario">

                                    <label for="nome">
                                        Nome do pet *
                                    </label>

                                    <input
                                        type="text"
                                        id="nome"
                                        name="nome"
                                        placeholder="Digite o nome do pet"
                                        required>

                                </div>


                                <div class="campo-formulario">

                                    <label for="tipo">
                                        Tipo *
                                    </label>

                                    <select
                                        id="tipo"
                                        name="tipo"
                                        required>

                                        <option value="">
                                            Selecione
                                        </option>

                                        <option value="cachorro">
                                            Cachorro
                                        </option>

                                        <option value="gato">
                                            Gato
                                        </option>

                                    </select>

                                </div>

                            </div>


                            <div class="linha-formulario">

                                <div class="campo-formulario">

                                    <label for="raca">
                                        Raça
                                    </label>

                                    <input
                                        type="text"
                                        id="raca"
                                        name="raca"
                                        placeholder="Digite a raça">

                                </div>


                                <div class="campo-formulario">

                                    <label for="porte">
                                        Porte *
                                    </label>

                                    <select
                                        id="porte"
                                        name="porte"
                                        required>

                                        <option value="">
                                            Selecione
                                        </option>

                                        <option value="pequeno">
                                            Pequeno
                                        </option>

                                        <option value="medio">
                                            Médio
                                        </option>

                                        <option value="grande">
                                            Grande
                                        </option>

                                    </select>

                                </div>

                            </div>


                            <div class="linha-formulario">

                                <div class="campo-formulario">

                                    <label for="idade">
                                        Idade
                                    </label>

                                    <input
                                        type="number"
                                        id="idade"
                                        name="idade"
                                        min="0"
                                        placeholder="Idade em anos">

                                </div>


                                <div class="campo-formulario">

                                    <label for="peso">
                                        Peso
                                    </label>

                                    <input
                                        type="text"
                                        id="peso"
                                        name="peso"
                                        placeholder="Ex.: 12 kg">

                                </div>

                            </div>

                        </div>


                        <!-- PROPRIETÁRIO -->
                        <div class="grupo-formulario">

                            <h3>Proprietário</h3>


                            <div class="linha-formulario">

                                <div class="campo-formulario">

                                    <label for="proprietario">
                                        Proprietário *
                                    </label>

                                    <select
                                        id="proprietario"
                                        name="proprietario"
                                        required>

                                        <option value="">
                                            Selecione o proprietário
                                        </option>

                                        <option value="maria">
                                            Maria Silva
                                        </option>

                                        <option value="joao">
                                            João Santos
                                        </option>

                                        <option value="ana">
                                            Ana Oliveira
                                        </option>

                                        <option value="carlos">
                                            Carlos Souza
                                        </option>

                                    </select>

                                </div>

                            </div>

                        </div>


                        <!-- CUIDADOS -->
                        <div class="grupo-formulario">

                            <h3>Cuidados e Observações</h3>


                            <div class="campo-formulario campo-largo">

                                <label for="alimentacao">
                                    Alimentação
                                </label>

                                <textarea
                                    id="alimentacao"
                                    name="alimentacao"
                                    placeholder="Informe os cuidados com a alimentação do pet"></textarea>

                            </div>


                            <div class="campo-formulario campo-largo">

                                <label for="observacoes">
                                    Observações
                                </label>

                                <textarea
                                    id="observacoes"
                                    name="observacoes"
                                    placeholder="Informe outras observações importantes"></textarea>

                            </div>

                        </div>


                        <!-- FOTO -->
                        <div class="grupo-formulario">

                            <h3>Foto do Pet</h3>

                            <div class="campo-formulario">

                                <label for="foto">
                                    Foto
                                </label>

                                <input
                                    type="file"
                                    id="foto"
                                    name="foto"
                                    accept="image/*">

                            </div>

                        </div>


                        <!-- BOTÕES -->
                        <div class="botoes-formulario">

                            <button
                                type="submit"
                                class="botao botao-salvar">
                                💾 Salvar
                            </button>


                            <button
                                type="reset"
                                class="botao botao-limpar">
                                ↻ Limpar
                            </button>


                            <a
                                href="pets.html"
                                class="botao">
                                ← Cancelar
                            </a>

                        </div>

                    </form>

                </section>

            </main>

        </div>

    </div>

</body>

</html>
