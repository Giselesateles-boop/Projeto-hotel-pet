<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet - Visualizar Usuário</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <div class="layout">

        <!-- MENU LATERAL -->
        <aside class="menu-lateral">

            <h1>Hotel Pet</h1>

            <nav>

                <a href="pets.html">
                    🐾 Pet
                </a>

                <a href="usuarios.html"
                    class="menu-ativo">
                    ♙ Usuário
                </a>

                <a href="configuracoes.html">
                    ⚙ Configurações
                </a>

                <a href="reservas.html">
                    ▣ Reservas
                </a>

            </nav>

        </aside>


        <!-- ÁREA PRINCIPAL -->
        <div class="conteudo">

            <!-- TOPO -->
            <header class="topo">

                <div></div>

                <a href="perfil.html"
                    class="perfil-topo">

                    <span class="icone-usuario">
                        ◯
                    </span>

                    <span>
                        Gisele Teles
                    </span>

                </a>

            </header>


            <!-- CONTEÚDO -->
            <main>

                <p class="breadcrumb">

                    <a href="dashboard.html">
                        Home
                    </a>

                    /

                    <a href="usuarios.html">
                        Usuários
                    </a>

                    /

                    Visualizar Usuário

                </p>


                <section class="card">

                    <h2>
                        Visualizar Usuário
                    </h2>


                    <!-- DADOS DO USUÁRIO -->
                    <section class="secao-formulario">

                        <h3>
                            Dados do Usuário
                        </h3>


                        <div class="formulario-duas-colunas">

                            <!-- ID -->
                            <div class="campo-formulario">

                                <label>
                                    ID
                                </label>

                                <input
                                    type="text"
                                    id="id-usuario"
                                    readonly>

                            </div>


                            <!-- NOME -->
                            <div class="campo-formulario">

                                <label>
                                    Nome
                                </label>

                                <input
                                    type="text"
                                    id="nome-usuario"
                                    readonly>

                            </div>


                            <!-- SOBRENOME -->
                            <div class="campo-formulario">

                                <label>
                                    Sobrenome
                                </label>

                                <input
                                    type="text"
                                    id="sobrenome-usuario"
                                    readonly>

                            </div>


                            <!-- E-MAIL -->
                            <div class="campo-formulario">

                                <label>
                                    E-mail
                                </label>

                                <input
                                    type="email"
                                    id="email-usuario"
                                    readonly>

                            </div>


                            <!-- TELEFONE -->
                            <div class="campo-formulario">

                                <label>
                                    Telefone
                                </label>

                                <input
                                    type="text"
                                    id="telefone-usuario"
                                    readonly>

                            </div>


                            <!-- FUNÇÃO -->
                            <div class="campo-formulario">

                                <label>
                                    Função
                                </label>

                                <input
                                    type="text"
                                    id="funcao-usuario"
                                    readonly>

                            </div>


                            <!-- STATUS -->
                            <div class="campo-formulario">

                                <label>
                                    Status
                                </label>

                                <input
                                    type="text"
                                    id="status-usuario"
                                    readonly>

                            </div>

                        </div>

                    </section>


                    <!-- ENDEREÇO -->
                    <section class="secao-formulario">

                        <h3>
                            Endereço
                        </h3>


                        <div class="formulario-duas-colunas">

                            <!-- CEP -->
                            <div class="campo-formulario">

                                <label>
                                    CEP
                                </label>

                                <input
                                    type="text"
                                    id="cep-usuario"
                                    readonly>

                            </div>


                            <!-- CIDADE -->
                            <div class="campo-formulario">

                                <label>
                                    Cidade
                                </label>

                                <input
                                    type="text"
                                    id="cidade-usuario"
                                    readonly>

                            </div>


                            <!-- ENDEREÇO -->
                            <div class="campo-formulario">

                                <label>
                                    Endereço
                                </label>

                                <input
                                    type="text"
                                    id="endereco-usuario"
                                    readonly>

                            </div>


                            <!-- NÚMERO -->
                            <div class="campo-formulario">

                                <label>
                                    Número
                                </label>

                                <input
                                    type="text"
                                    id="numero-usuario"
                                    readonly>

                            </div>

                        </div>

                    </section>


                    <!-- FOTO -->
                    <section class="secao-formulario">

                        <h3>
                            Foto do Usuário
                        </h3>


                        <div class="foto-pet">

                            <img
                                id="foto-usuario"
                                src=""
                                alt="Foto do usuário"
                                style="
                                    width: 180px;
                                    height: 180px;
                                    object-fit: cover;
                                    border-radius: 50%;
                                    display: block;
                                ">

                        </div>

                    </section>


                    <!-- HISTÓRICO -->
                    <section class="secao-formulario">

                        <h3>
                            Histórico de Reservas
                        </h3>


                        <table class="tabela">

                            <thead>

                                <tr>

                                    <th>
                                        Reserva
                                    </th>

                                    <th>
                                        Pet
                                    </th>

                                    <th>
                                        Entrada
                                    </th>

                                    <th>
                                        Saída
                                    </th>

                                    <th>
                                        Status
                                    </th>

                                </tr>

                            </thead>


                            <tbody id="historico-usuario">

                            </tbody>

                        </table>

                    </section>


                    <!-- BOTÕES -->
                    <div class="botoes-formulario">

                        <a
                            id="botao-editar"
                            href="editar-usuario.html"
                            class="botao botao-salvar">

                            ✎ Editar

                        </a>


                        <a
                            href="usuarios.html"
                            class="botao botao-cancelar">

                            ← Voltar

                        </a>

                    </div>

                </section>

            </main>

        </div>

    </div>


    <!-- DADOS DOS USUÁRIOS -->
    <script>

        const usuarios = {

            maria: {

                id: "001",

                nome: "Maria",

                sobrenome: "Silva",

                email: "maria@email.com",

                telefone: "(77) 99999-9999",

                funcao: "Cliente",

                status: "Ativo",

                cep: "47500-000",

                cidade: "Paratinga",

                endereco: "Rua Principal",

                numero: "100",

                foto: "../img/Maria.png",

                historico: [

                    {
                        reserva: "001",
                        pet: "Thor",
                        entrada: "20/08/2026",
                        saida: "25/08/2026",
                        status: "Confirmada"
                    },

                    {
                        reserva: "005",
                        pet: "Thor",
                        entrada: "10/07/2026",
                        saida: "15/07/2026",
                        status: "Finalizada"
                    }

                ]

            },


            joao: {

                id: "002",

                nome: "João",

                sobrenome: "Santos",

                email: "joao@email.com",

                telefone: "(77) 98888-8888",

                funcao: "Cliente",

                status: "Ativo",

                cep: "47500-000",

                cidade: "Paratinga",

                endereco: "Rua das Flores",

                numero: "200",

                foto: "../img/joao.png",

                historico: [

                    {
                        reserva: "002",
                        pet: "Luna",
                        entrada: "21/08/2026",
                        saida: "24/08/2026",
                        status: "Em andamento"
                    }

                ]

            },


            ana: {

                id: "003",

                nome: "Ana",

                sobrenome: "Oliveira",

                email: "ana@email.com",

                telefone: "(77) 97777-7777",

                funcao: "Funcionário",

                status: "Ativo",

                cep: "47500-000",

                cidade: "Paratinga",

                endereco: "Rua da Paz",

                numero: "300",

                foto: "../img/Ana.png",

                historico: [

                    {
                        reserva: "003",
                        pet: "Mel",
                        entrada: "15/08/2026",
                        saida: "18/08/2026",
                        status: "Finalizada"
                    }

                ]

            },


            gisele: {

                id: "004",

                nome: "Gisele",

                sobrenome: "Teles",

                email: "gisele@email.com",

                telefone: "(77) 96666-6666",

                funcao: "Gerente",

                status: "Ativo",

                cep: "47500-000",

                cidade: "Paratinga",

                endereco: "Rua Central",

                numero: "400",

                foto: "../img/Gisele.png",

                historico: [

                    {
                        reserva: "004",
                        pet: "Bob",
                        entrada: "25/08/2026",
                        saida: "30/08/2026",
                        status: "Agendada"
                    }

                ]

            }

        };


        // PEGAR USUÁRIO DA URL

        const parametros =
            new URLSearchParams(
                window.location.search
            );


        const usuarioSelecionado =
            parametros.get("usuario") || "maria";


        // ENCONTRAR USUÁRIO

        const usuario =
            usuarios[usuarioSelecionado]
            || usuarios.maria;


        // PREENCHER DADOS

        document.getElementById("id-usuario").value =
            usuario.id;

        document.getElementById("nome-usuario").value =
            usuario.nome;

        document.getElementById("sobrenome-usuario").value =
            usuario.sobrenome;

        document.getElementById("email-usuario").value =
            usuario.email;

        document.getElementById("telefone-usuario").value =
            usuario.telefone;

        document.getElementById("funcao-usuario").value =
            usuario.funcao;

        document.getElementById("status-usuario").value =
            usuario.status;


        // ENDEREÇO

        document.getElementById("cep-usuario").value =
            usuario.cep;

        document.getElementById("cidade-usuario").value =
            usuario.cidade;

        document.getElementById("endereco-usuario").value =
            usuario.endereco;

        document.getElementById("numero-usuario").value =
            usuario.numero;


        // FOTO

        const fotoUsuario =
            document.getElementById("foto-usuario");

        fotoUsuario.src =
            usuario.foto;

        fotoUsuario.alt =
            "Foto de " +
            usuario.nome +
            " " +
            usuario.sobrenome;


        // HISTÓRICO

        const historico =
            document.getElementById(
                "historico-usuario"
            );


        usuario.historico.forEach(
            function(reserva) {

                const linha =
                    document.createElement("tr");


                linha.innerHTML = `

                    <td>
                        ${reserva.reserva}
                    </td>

                    <td>
                        ${reserva.pet}
                    </td>

                    <td>
                        ${reserva.entrada}
                    </td>

                    <td>
                        ${reserva.saida}
                    </td>

                    <td>
                        ${reserva.status}
                    </td>

                `;


                historico.appendChild(linha);

            }
        );


        // BOTÃO EDITAR

        document.getElementById(
            "botao-editar"
        ).href =
            "editar-usuario.html?usuario="
            + usuarioSelecionado;

    </script>

</body>

</html>
