
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Visualizar Usuário</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="layout">
        <aside class="menu-lateral">
            <h1>Hotel Pet</h1>
            <nav>
                <a href="pets.html">Pet</a>
                <a href="usuarios.html" class="menu-ativo">Usuário</a>
                <a href="configuracoes.html">Configurações</a>
                <a href="reservas.html">Reservas</a>
            </nav>
        </aside>

        <div class="conteudo">
            <header class="topo">
                <div></div>
                <a href="perfil.html" class="perfil-topo">
                    <span class="icone-usuario">O</span>
                    <span>Gisele Teles</span>
                </a>
            </header>

            <main>
                <p class="breadcrumb">
                    <a href="dashboard.html">Home</a> /
                    <a href="usuarios.html">Usuários</a> /
                    Visualizar Usuário
                </p>

                <section class="card">
                    <h2>Visualizar Usuário</h2>

                    <section class="secao-formulario">
                        <h3 id="titulo-usuario">Dados do Usuário</h3>
                        <div class="formulario-duas-colunas">
                            <div class="campo-formulario">
                                <label>ID</label>
                                <input id="id-usuario" readonly>
                            </div>
                            <div class="campo-formulario">
                                <label>Nome</label>
                                <input id="nome-usuario" readonly>
                            </div>
                            <div class="campo-formulario">
                                <label>Sobrenome</label>
                                <input id="sobrenome-usuario" readonly>
                            </div>
                            <div class="campo-formulario">
                                <label>E-mail</label>
                                <input id="email-usuario" type="email" readonly>
                            </div>
                            <div class="campo-formulario">
                                <label>Telefone</label>
                                <input id="telefone-usuario" readonly>
                            </div>
                            <div class="campo-formulario">
                                <label>Função</label>
                                <input id="funcao-usuario" readonly>
                            </div>
                            <div class="campo-formulario">
                                <label>Status</label>
                                <input id="status-usuario" readonly>
                            </div>
                        </div>
                    </section>

                    <section class="secao-formulario">
                        <h3>Endereço</h3>
                        <div class="formulario-duas-colunas">
                            <div class="campo-formulario">
                                <label>CEP</label>
                                <input id="cep-usuario" readonly>
                            </div>
                            <div class="campo-formulario">
                                <label>Cidade</label>
                                <input id="cidade-usuario" readonly>
                            </div>
                            <div class="campo-formulario">
                                <label>Endereço</label>
                                <input id="endereco-usuario" readonly>
                            </div>
                            <div class="campo-formulario">
                                <label>Número</label>
                                <input id="numero-usuario" readonly>
                            </div>
                        </div>
                    </section>

                    <section class="secao-formulario">
                        <h3>Foto do Usuário</h3>
                        <div class="foto-pet">
                            <img id="foto-usuario" src="../img/Maria.png"
                                alt="Foto do usuário"
                                style="width:180px;height:180px;object-fit:cover;border-radius:50%;display:block;">
                        </div>
                    </section>

                    <section class="secao-formulario">
                        <h3>Histórico de Reservas</h3>
                        <table class="tabela">
                            <thead>
                                <tr>
                                    <th>Reserva</th>
                                    <th>Pet</th>
                                    <th>Entrada</th>
                                    <th>Saída</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="historico-reservas"></tbody>
                        </table>
                    </section>

                    <div class="botoes-formulario">
                        <a id="botao-editar" href="editar-usuario.html"
                            class="botao botao-salvar">Editar</a>
                        <a href="usuarios.html"
                            class="botao botao-cancelar">Voltar</a>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="../js/navegacao.js"></script>
    <script>
        const usuarios = {
            maria: {
                id: "001",
                nome: "Maria",
                sobrenome: "Silva",
                email: "maria@email.com",
                telefone: "(77) 99999-9999",
                funcao: "Cliente",
                status: "Ativo",
                cep: "47500-000",
                cidade: "Paratinga",
                endereco: "Rua Principal",
                numero: "100",
                foto: "../img/Maria.png",
                reservas: [
                    ["001", "Thor", "20/08/2026", "25/08/2026", "Confirmada"],
                    ["005", "Thor", "10/07/2026", "15/07/2026", "Finalizada"]
                ]
            },
            joao: {
                id: "002",
                nome: "João",
                sobrenome: "Santos",
                email: "joao@email.com",
                telefone: "(77) 98888-8888",
                funcao: "Cliente",
                status: "Ativo",
                cep: "Não informado",
                cidade: "Não informada",
                endereco: "Não informado",
                numero: "Não informado",
                foto: "../img/Joao.png",
                reservas: []
            },
            ana: {
                id: "003",
                nome: "Ana",
                sobrenome: "Oliveira",
                email: "ana@email.com",
                telefone: "(77) 97777-7777",
                funcao: "Funcionário",
                status: "Ativo",
                cep: "Não informado",
                cidade: "Não informada",
                endereco: "Não informado",
                numero: "Não informado",
                foto: "../img/Ana.png",
                reservas: []  
            },
gisele: {
    id: "004",
    nome: "Gisele",
    sobrenome: "Teles",
    email: "gisele@email.com",
    telefone: "(77) 96666-6666",
    funcao: "Gerente",
    status: "Ativo",
    cep: "Não informado",
    cidade: "Não informada",
    endereco: "Não informado",
    numero: "Não informado",
    foto: "../img/Gisele.png",
    reservas: []
},
        };

        const parametros = new URLSearchParams(window.location.search);
       const identificador = (parametros.get("usuario") || "maria").toLowerCase();

const usuariosSalvos = JSON.parse(
    localStorage.getItem("hotelPetUsuarios") || "{}"
);

const usuario = usuarios[identificador]
    ? { ...usuarios[identificador], ...(usuariosSalvos[identificador] || {}) }
    : null;
        if (usuario) {
            document.getElementById("titulo-usuario").textContent =
                "Dados do Usuário";

            document.getElementById("id-usuario").value = usuario.id;
            document.getElementById("nome-usuario").value = usuario.nome;
            document.getElementById("sobrenome-usuario").value = usuario.sobrenome;
            document.getElementById("email-usuario").value = usuario.email;
            document.getElementById("telefone-usuario").value = usuario.telefone;
            document.getElementById("funcao-usuario").value = usuario.funcao;
            document.getElementById("status-usuario").value = usuario.status;
            document.getElementById("cep-usuario").value = usuario.cep;
            document.getElementById("cidade-usuario").value = usuario.cidade;
            document.getElementById("endereco-usuario").value = usuario.endereco;
            document.getElementById("numero-usuario").value = usuario.numero;

            document.getElementById("foto-usuario").src = usuario.foto;
            document.getElementById("foto-usuario").alt =
                "Foto de " + usuario.nome + " " + usuario.sobrenome;

            const historico = document.getElementById("historico-reservas");

            usuario.reservas.forEach(reserva => {
                const linha = document.createElement("tr");

                reserva.forEach(informacao => {
                    const celula = document.createElement("td");
                    celula.textContent = informacao;
                    linha.appendChild(celula);
                });

                historico.appendChild(linha);
            });

            if (usuario.reservas.length === 0) {
                const linha = document.createElement("tr");
                const celula = document.createElement("td");
                celula.colSpan = 5;
                celula.textContent = "Nenhuma reserva cadastrada.";
                linha.appendChild(celula);
                historico.appendChild(linha);
            }

            document.getElementById("botao-editar").href =
                "editar-usuario.html?usuario=" +
                encodeURIComponent(identificador);
        } else {
            document.getElementById("titulo-usuario").textContent =
                "Usuário não encontrado";

            document.querySelectorAll(".secao-formulario").forEach(secao => {
                secao.hidden = true;
            });

            document.getElementById("botao-editar").hidden = true;
        }
    </script>
</body>
</html>
